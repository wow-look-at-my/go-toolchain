name: 'Go Safe Build'
description: 'Build Go projects with coverage enforcement - fails if coverage is below threshold'
author: 'go-toolchain'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  json:
    description: 'Output coverage report as JSON'
    required: false
    default: 'false'
  generate:
    description: 'Run go:generate directives matching this hash'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the build'
    required: false
    default: '.'
  binary:
    description: 'Path to a pre-built go-toolchain binary (skips release download)'
    required: false
    default: ''
  os:
    description: 'Comma-separated list of target operating systems (e.g. linux,darwin,windows)'
    required: false
    default: 'linux,darwin,windows'
  arch:
    description: 'Comma-separated list of target architectures (e.g. amd64,arm64)'
    required: false
    default: 'amd64,arm64'
  cgo:
    description: 'Enable CGO (disabled by default for static binaries)'
    required: false
    default: 'false'
  autorelease:
    description: 'Automatically create a GitHub release when running on the default branch (requires contents: write permission)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Fetch secrets
      shell: bash
      env:
        SECRET_SERVER_URL: https://secrets.pazer.io
      run: |
        OIDC_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SECRET_SERVER_URL}" | jq -r '.value')
        if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
          echo "::error::Failed to obtain OIDC token"
          exit 1
        fi
        HTTP_CODE=$(curl -s -o /tmp/secrets_response.json -w '%{http_code}' \
          -H "Authorization: Bearer ${OIDC_TOKEN}" \
          "${SECRET_SERVER_URL}/github/v1/secrets")
        if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
          echo "::error::Secret server returned HTTP ${HTTP_CODE}: $(cat /tmp/secrets_response.json)"
          exit 1
        fi
        SECRETS=$(cat /tmp/secrets_response.json)
        rm -f /tmp/secrets_response.json
        echo "${SECRETS}" | jq -r 'to_entries[] | .key' | while IFS= read -r key; do
          val=$(echo "${SECRETS}" | jq -r --arg k "$key" '.[$k]')
          echo "::add-mask::${val}"
          delimiter="ghadelimiter_$(openssl rand -hex 8)"
          printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$val" "$delimiter" >> "$GITHUB_ENV"
        done

    - name: Configure git for private repos
      if: env.PRIVATE_ORG_REPO_READ != ''
      shell: bash
      run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

    - name: Configure netrc for Go proxy
      if: env.GO_PROXY_CONFIG != ''
      shell: bash
      run: |
        USER=$(echo "$GO_PROXY_CONFIG" | base64 -d | jq -r '.user // .username // .login')
        PASS=$(echo "$GO_PROXY_CONFIG" | base64 -d | jq -r '.password // .pass')
        echo "::add-mask::${USER}"
        echo "::add-mask::${PASS}"
        cat >> ~/.netrc <<EOF
        machine goproxy.pazer.io login ${USER} password ${PASS}
        EOF
        chmod 600 ~/.netrc

    - name: Download go-toolchain
      if: inputs.binary == ''
      uses: wow-look-at-my/actions@download-release-binary#latest
      with:
        repo: wow-look-at-my/go-toolchain
        name: go-toolchain
        token: ${{ github.token }}

    - name: Install provided binary
      if: inputs.binary != ''
      shell: bash
      run: |
        chmod +x "${{ inputs.binary }}"
        sudo cp "${{ inputs.binary }}" /usr/local/bin/go-toolchain

    - name: Run go-toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GOPROXY: goproxy.pazer.io
        GOSUMDB: gosumdb.pazer.io
      run: |
        set -euo pipefail
        ARGS=""
        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS="$ARGS --json"
        fi
        if [ -n "${{ inputs.generate }}" ]; then
          ARGS="$ARGS --generate ${{ inputs.generate }}"
        fi
        if [ -n "${{ inputs.os }}" ]; then
          ARGS="$ARGS --os ${{ inputs.os }}"
        fi
        if [ -n "${{ inputs.arch }}" ]; then
          ARGS="$ARGS --arch ${{ inputs.arch }}"
        fi
        if [ "${{ inputs.cgo }}" = "true" ]; then
          ARGS="$ARGS --cgo"
        fi
        go-toolchain matrix $ARGS

    - name: Auto-release
      if: inputs.autorelease == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="v0.0.$(git log -1 --format=%ct)"
        echo "==> Auto-releasing $TAG on default branch"
        go-toolchain release --tag "$TAG"
