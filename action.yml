name: 'Go Safe Build'
description: 'Build Go projects with coverage enforcement - fails if coverage is below threshold'
author: 'go-toolchain'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  json:
    description: 'Output coverage report as JSON'
    required: false
    default: 'false'
  generate:
    description: 'Run go:generate directives matching this hash'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the build'
    required: false
    default: '.'
  binary:
    description: 'Path to a pre-built go-toolchain binary (skips release download)'
    required: false
    default: ''
  targets:
    description: >-
      Comma-separated wasm targets to add (wasm/js, wasm/wasip1, built with
      the gosmopolitan toolchain) plus the special value "cosmo" (one fat
      APE, the org's only native output). Empty (the default) builds the APE
      alone.
    required: false
    default: ''
  cosmo-platforms:
    description: >-
      Host platforms the fat APE must cover, as comma-separated os/arch pairs.
      One binary runs on all of them and publishes as ONE artifact carrying the
      whole set. "all" covers every platform the gosmopolitan fork can emit.
    required: false
    default: 'linux/amd64,darwin/arm64,windows/amd64'
  cgo:
    description: 'Enable CGO (disabled by default for static binaries)'
    required: false
    default: 'false'
  autorelease:
    description: 'Automatically publish to buildhost on every branch push (requires id-token: write, plus deployments: write and artifact-metadata: write -- the publish registers a GitHub Deployment and posts an artifact storage record as part of publishing, with no opt-out, and fails the build without either grant)'
    required: false
    default: 'true'
  autorelease_args:
    description: >-
      Extra publish options forwarded to the buildhost publish, as
      whitespace- or comma-separated key=value pairs (e.g.
      "create_service=true"). Recognized keys: create_service (true|false --
      declare that the published binary runs as a background service; each
      download format materializes it, e.g. brew formulas gain a `service do`
      block and generated debs ship an auto-enabled systemd user unit).
      Unknown keys fail the build. Empty (the default) forwards nothing --
      the publish request is byte-identical to before this input existed.
    required: false
    default: ''
  allow-source-build:
    description: 'Allow building go-toolchain from source when the buildhost binary is unavailable. When false (default), the build fails fast instead of silently falling back to a source build.'
    required: false
    default: 'false'
  timeout:
    description: 'Timeout in minutes for the go-toolchain build step'
    required: false
    default: '10'
  codeql:
    description: 'Run CodeQL security-and-quality analysis around the build (requires security-events: write permission, and the consumer repo must NOT have GitHub default CodeQL setup enabled)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Run the org's common checks
      uses: wow-look-at-my/actions@common-checks#latest

    - uses: wow-look-at-my/actions@secret-server#latest

    - name: Configure git for private repos
      if: env.PRIVATE_ORG_REPO_READ != ''
      shell: bash
      run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

    - name: Install go-toolchain
      if: inputs.binary == '' && github.repository != 'wow-look-at-my/go-toolchain'
      shell: bash
      run: |
        set -euo pipefail
        URL="https://dl.pazer.build/go-toolchain?os=${RUNNER_OS}&arch=${RUNNER_ARCH}"
        # The `if` keeps `set -e` from skipping the probe and source-build fallback.
        if curl -fL --compressed --connect-timeout 20 --max-time 120 -o /tmp/go-toolchain "${URL}"; then
          chmod +x /tmp/go-toolchain
          # Run it once while still writable in /tmp. see docs/ACTION.md
          /tmp/go-toolchain version || true
          sudo cp /tmp/go-toolchain /usr/local/bin/go-toolchain
        else
          echo "::warning::Download from buildhost failed (curl exit $?): ${URL}"
        fi
        # Capture the probe output: it names a 404, a missing PATH entry, or a crash.
        if ! probe=$(go-toolchain version 2>&1); then
          echo "buildhost go-toolchain (${URL}) not usable; probe output:"
          echo "${probe}"
          # A silent source build hides a buildhost outage. see docs/ACTION.md
          if [ "${{ inputs.allow-source-build }}" != "true" ]; then
            echo "::error::Could not install go-toolchain from buildhost and allow-source-build is not enabled. Set allow-source-build: 'true' to build from source instead."
            exit 1
          fi
          echo "::warning::buildhost binary not usable; building from source (allow-source-build=true)"
          (cd "${{ github.action_path }}" && GOTOOLCHAIN=auto go install ./src)
          sudo cp "$(go env GOPATH)/bin/src" /usr/local/bin/go-toolchain
        fi

    - name: Install provided binary
      if: inputs.binary != ''
      shell: bash
      run: |
        # Stage through /tmp and pre-run once. see docs/ACTION.md
        cp "${{ inputs.binary }}" /tmp/go-toolchain-provided
        chmod +x /tmp/go-toolchain-provided
        /tmp/go-toolchain-provided version || true
        sudo cp /tmp/go-toolchain-provided /usr/local/bin/go-toolchain

    - name: Install timeout (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install coreutils
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Require the id-token grant autorelease needs
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/actions@has-permission#latest
      with:
        permission: id-token

    - name: Require the deployments grant autorelease needs
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/actions@has-permission#latest
      with:
        permission: deployments

    - name: Require the artifact-metadata grant autorelease needs
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/actions@has-permission#latest
      with:
        permission: artifact-metadata

    - name: Require the security-events grant CodeQL needs
      if: inputs.codeql == 'true'
      uses: wow-look-at-my/actions@has-permission#latest
      with:
        permission: security-events

    - name: Initialize CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: go
        build-mode: manual
        queries: security-and-quality

    - name: Run go-toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
        OTEL_SERVICE_NAME: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TIMEOUT_SECONDS=$(( ${{ inputs.timeout }} * 60 ))
        ARGS=""
        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS="$ARGS --json"
        fi
        if [ -n "${{ inputs.generate }}" ]; then
          ARGS="$ARGS --generate ${{ inputs.generate }}"
        fi
        # The default builds ONE fat APE. see docs/ACTION.md
        if [ -n "${{ inputs.targets }}" ]; then
          ARGS="$ARGS --targets ${{ inputs.targets }}"
        fi
        if [ -n "${{ inputs.cosmo-platforms }}" ]; then
          ARGS="$ARGS --cosmo-platforms ${{ inputs.cosmo-platforms }}"
        fi
        if [ "${{ inputs.cgo }}" = "true" ]; then
          ARGS="$ARGS --cgo"
        fi
        timeout "${TIMEOUT_SECONDS}" go-toolchain matrix $ARGS

    # The name must stay unique per job, per matrix leg, AND per build (working-directory). see docs/ACTION.md
    - name: Compute hand-off build identity
      id: build-id
      shell: bash
      run: |
        wd="${{ inputs.working-directory }}"
        id="$(printf '%s' "$wd" | tr '/.' '-' | sed -E 's/^-+//; s/-+$//')"
        [ -n "$id" ] || id="root"
        echo "id=$id" >> "$GITHUB_OUTPUT"

    - name: Hand off build outputs (go-build-<job>.<build>)
      uses: wow-look-at-my/actions@cache-upload#latest
      with:
        name: go-build-${{ github.job }}${{ matrix && format('.m{0}', strategy.job-index) || '' }}.b${{ steps.build-id.outputs.id }}
        path: ${{ inputs.working-directory }}/build

    - name: Analyze with CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:go

    # A composite `with:` block is static YAML. see docs/ACTION.md
    - name: Parse autorelease_args
      if: inputs.autorelease == 'true'
      id: autorelease_args
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          const raw: string = "${{ inputs.autorelease_args }}";
          const known: string[] = ["create_service"];
          const out: Record<string, string> = {};
          for (const key of known) out[key] = "";
          for (const pair of raw.split(/[\s,]+/).filter((p: string) => p.length > 0)) {
            const eq = pair.indexOf("=");
            const key = eq < 0 ? pair : pair.slice(0, eq);
            const value = eq < 0 ? "" : pair.slice(eq + 1);
            if (!known.includes(key) || value === "") {
              core.setFailed(`autorelease_args: unrecognized or valueless entry '${pair}' (known keys: ${known.join(", ")}; form: key=value)`);
              return;
            }
            out[key] = value;
          }
          for (const key of known) core.setOutput(key, out[key]);

    - name: Auto-release to buildhost
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
      with:
        path: ${{ inputs.working-directory }}/build
        create_service: ${{ steps.autorelease_args.outputs.create_service }}
