name: 'Go Safe Build'
description: 'Build Go projects with coverage enforcement - fails if coverage is below threshold'
author: 'go-toolchain'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  json:
    description: 'Output coverage report as JSON'
    required: false
    default: 'false'
  generate:
    description: 'Run go:generate directives matching this hash'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the build'
    required: false
    default: '.'
  go-version:
    description: 'Go version to install (e.g. 1.25). Overrides go-version-file.'
    required: false
    default: ''
  go-version-file:
    description: 'Path to go.mod to read Go version from'
    required: false
    default: './go.mod'

outputs:
  coverage:
    description: 'Total coverage percentage'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version-file }}
        cache: true

    - name: Download go-toolchain
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        ARCH=$(uname -m)
        case "$ARCH" in x86_64) ARCH=amd64;; aarch64) ARCH=arm64;; esac
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        PATTERN="go-toolchain_${OS}_${ARCH}"
        BINDIR="$HOME/.local/bin"
        mkdir -p "$BINDIR"
        gh release download --repo wow-look-at-my/go-toolchain --pattern "$PATTERN" --dir "$BINDIR" --clobber
        mv "$BINDIR/$PATTERN" "$BINDIR/go-toolchain"
        chmod +x "$BINDIR/go-toolchain"
        echo "$BINDIR" >> "$GITHUB_PATH"

    - name: Run go-toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        ARGS=""
        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS="$ARGS --json"
        fi
        if [ -n "${{ inputs.generate }}" ]; then
          ARGS="$ARGS --generate ${{ inputs.generate }}"
        fi
        go-toolchain matrix $ARGS
