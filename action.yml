name: 'Go Safe Build'
description: 'Build Go projects with coverage enforcement - fails if coverage is below threshold'
author: 'go-toolchain'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  json:
    description: 'Output coverage report as JSON'
    required: false
    default: 'false'
  generate:
    description: 'Run go:generate directives matching this hash'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the build'
    required: false
    default: '.'
  binary:
    description: 'Path to a pre-built go-toolchain binary (skips release download)'
    required: false
    default: ''
  os:
    description: 'Comma-separated list of target operating systems (e.g. linux,darwin,windows)'
    required: false
    default: 'linux,darwin,windows'
  arch:
    description: 'Comma-separated list of target architectures (e.g. amd64,arm64)'
    required: false
    default: 'amd64,arm64'
  targets:
    description: 'Comma-separated exact build targets, each an os/arch pair (e.g. darwin/amd64) or the special value "cosmo" (one fat APE built with the gosmopolitan toolchain, plus per-platform slot copies). When non-empty this replaces the os/arch inputs.'
    required: false
    default: ''
  cgo:
    description: 'Enable CGO (disabled by default for static binaries)'
    required: false
    default: 'false'
  autorelease:
    description: 'Automatically publish to buildhost on every branch push (requires id-token: write permission; with deployments: write it also registers a GitHub Deployment, skipped with a warning otherwise)'
    required: false
    default: 'true'
  autorelease_args:
    description: >-
      Extra publish options forwarded to the buildhost publish, as
      whitespace- or comma-separated key=value pairs (e.g.
      "create_service=true"). Recognized keys: create_service (true|false --
      declare that the published binary runs as a background service; each
      download format materializes it, e.g. brew formulas gain a `service do`
      block and generated debs ship an auto-enabled systemd user unit).
      Unknown keys fail the build. Empty (the default) forwards nothing --
      the publish request is byte-identical to before this input existed.
    required: false
    default: ''
  allow-source-build:
    description: 'Allow building go-toolchain from source when the buildhost binary is unavailable. When false (default), the build fails fast instead of silently falling back to a source build.'
    required: false
    default: 'false'
  timeout:
    description: 'Timeout in minutes for the go-toolchain build step'
    required: false
    default: '10'
  wait-ci:
    description: 'Wait for the latest go-toolchain CI run to finish before downloading the release binary'
    required: false
    default: 'false'
  codeql:
    description: 'Run CodeQL security-and-quality analysis around the build (requires security-events: write permission, and the consumer repo must NOT have GitHub default CodeQL setup enabled)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Refuse jobs named all-builds
      uses: wow-look-at-my/actions@no-all-builds-job#latest

    - uses: wow-look-at-my/actions@secret-server#latest

    - name: Configure git for private repos
      if: env.PRIVATE_ORG_REPO_READ != ''
      shell: bash
      run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

    - name: Wait for go-toolchain CI to finish
      if: inputs.binary == '' && github.repository != 'wow-look-at-my/go-toolchain' && inputs.wait-ci == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh extension install PazerOP/gh-wait-ci || true
        gh wait-ci -R wow-look-at-my/go-toolchain || true

    - name: Install go-toolchain
      if: inputs.binary == '' && github.repository != 'wow-look-at-my/go-toolchain'
      shell: bash
      run: |
        set -euo pipefail
        # Download the released binary straight from buildhost's dl endpoint with
        # curl -- no npm. --compressed advertises Accept-Encoding (including zstd
        # when curl was built with it), so buildhost streams the stored zstd blob
        # as-is and curl decompresses client-side; the server never pays the
        # decompression cost. If curl lacks zstd it just gets the plain binary.
        # buildhost normalizes platform aliases natively (RUNNER_OS Linux/macOS/
        # Windows, RUNNER_ARCH X64/ARM64, ...), so pass them through verbatim, and
        # it serves the branch tip no-store, so no cache-buster is needed.
        #
        # TEMPORARY: pinned to ?branch=v1 instead of the apex "latest". buildhost's
        # "latest" resolves against a project's default branch; until buildhost has
        # learned go-toolchain's default branch is "v1" it defaults to "master"
        # (which go-toolchain never publishes to), so the unqualified latest
        # download 404s and hard-fails every consumer's build. Revert to the
        # unqualified URL once buildhost has resolved go-toolchain's default branch
        # to v1 (buildhost deploy + the next go-toolchain publish).
        URL="https://dl.pazer.build/go-toolchain?branch=v1&os=${RUNNER_OS}&arch=${RUNNER_ARCH}"
        # Install only on a successful download. A failure is reported (not hidden
        # behind `|| true`) but is non-fatal here: gating with `if` keeps `set -e`
        # from skipping the probe + source-build fallback below, which surface the
        # reason and decide whether to fail the build.
        if curl -fL --compressed --connect-timeout 20 --max-time 120 -o /tmp/go-toolchain "${URL}"; then
          chmod +x /tmp/go-toolchain
          # Run the binary once BEFORE the root-owned install. Since the
          # fat-APE migration (#275) the linux and windows/amd64 slots serve
          # an APE polyglot that self-assimilates on first exec by reopening
          # ITSELF read-write -- fine here while the file is still
          # runner-writable in /tmp, impossible for the non-root runner once
          # it is root-owned in /usr/local/bin ("line 11: ... Permission
          # denied"). After this run, the installed file is a plain native
          # binary. For native slots (e.g. darwin/arm64) this is just an
          # early version check. Failures are tolerated (|| true): the probe
          # below stays the single pass/fail gate and surfaces the reason.
          /tmp/go-toolchain version || true
          sudo cp /tmp/go-toolchain /usr/local/bin/go-toolchain
        else
          echo "::warning::Download from buildhost failed (curl exit $?): ${URL}"
        fi
        # Probe the installed binary. Capture the output (don't discard it) so
        # the real reason it is unusable -- 404, not on PATH, or a crash -- is shown.
        if ! probe=$(go-toolchain version 2>&1); then
          echo "buildhost go-toolchain (${URL}) not usable; probe output:"
          echo "${probe}"
          # Fail fast unless the caller has explicitly opted in to a source
          # build: a silent fallback hides buildhost outages and ships a
          # locally-compiled toolchain that may differ from the released one.
          if [ "${{ inputs.allow-source-build }}" != "true" ]; then
            echo "::error::Could not install go-toolchain from buildhost and allow-source-build is not enabled. Set allow-source-build: 'true' to build from source instead."
            exit 1
          fi
          echo "::warning::buildhost binary not usable; building from source (allow-source-build=true)"
          (cd "${{ github.action_path }}" && GOTOOLCHAIN=auto go install ./src)
          sudo cp "$(go env GOPATH)/bin/src" /usr/local/bin/go-toolchain
        fi

    - name: Install provided binary
      if: inputs.binary != ''
      shell: bash
      run: |
        # Stage through /tmp and pre-run once so a fat-APE binary
        # self-assimilates while still runner-writable (see the buildhost
        # install step above for why); staging also keeps the caller's file
        # byte-identical. For a native binary this changes nothing.
        cp "${{ inputs.binary }}" /tmp/go-toolchain-provided
        chmod +x /tmp/go-toolchain-provided
        /tmp/go-toolchain-provided version || true
        sudo cp /tmp/go-toolchain-provided /usr/local/bin/go-toolchain

    - name: Install timeout (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install coreutils
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Verify security-events write permission
      if: inputs.codeql == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        GH_API: ${{ github.api_url }}
      run: |
        set -euo pipefail
        # Probe the SARIF upload endpoint with an empty body.
        # 403 = workflow lacks security-events: write.
        # 422 = permission OK, body invalid (expected, no upload occurs).
        HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${GH_API}/repos/${GH_REPO}/code-scanning/sarifs" \
          -d '{}')
        if [ "${HTTP_CODE}" = "403" ]; then
          echo "::error title=Missing security-events: write::CodeQL is enabled but this workflow lacks 'security-events: write'. Add 'permissions: { security-events: write }' to the workflow, or pass codeql: 'false' to disable CodeQL."
          exit 1
        fi
        echo "security-events: write confirmed (probe HTTP ${HTTP_CODE})"

    - name: Verify autorelease permissions
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          // Verify id-token: write via OIDC environment variables. On external
          // fork PRs GitHub withholds OIDC regardless of declared permissions;
          // skip rather than fail spuriously.
          const isForkPr = context.eventName === 'pull_request' &&
            (context.payload as any)?.pull_request?.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;
          if (isForkPr) {
            core.info("External fork PR: skipping id-token check (OIDC unavailable on external fork PRs)");
          } else if (!env.ACTIONS_ID_TOKEN_REQUEST_URL || !env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            core.setFailed("autorelease is enabled but this workflow lacks 'id-token: write', needed to mint an OIDC token for buildhost authentication. Add 'permissions: { id-token: write }', or pass autorelease: 'false' to disable publishing.");
          } else {
            core.info('id-token: write confirmed (OIDC environment variables present)');
          }

    - name: Initialize CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: go
        build-mode: manual
        queries: security-and-quality

    - name: Run go-toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
        OTEL_SERVICE_NAME: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TIMEOUT_SECONDS=$(( ${{ inputs.timeout }} * 60 ))
        ARGS=""
        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS="$ARGS --json"
        fi
        if [ -n "${{ inputs.generate }}" ]; then
          ARGS="$ARGS --generate ${{ inputs.generate }}"
        fi
        if [ -n "${{ inputs.targets }}" ]; then
          # --targets replaces the --os x --arch matrix entirely.
          ARGS="$ARGS --targets ${{ inputs.targets }}"
        else
          if [ -n "${{ inputs.os }}" ]; then
            ARGS="$ARGS --os ${{ inputs.os }}"
          fi
          if [ -n "${{ inputs.arch }}" ]; then
            ARGS="$ARGS --arch ${{ inputs.arch }}"
          fi
        fi
        if [ "${{ inputs.cgo }}" = "true" ]; then
          ARGS="$ARGS --cgo"
        fi
        timeout "${TIMEOUT_SECONDS}" go-toolchain matrix $ARGS

    # Hand the build/ outputs off to later jobs in the same run via the org
    # cache-upload action (artifact-free replacement for actions/upload-artifact;
    # cache storage is free, artifact storage is billed). This runs on EVERY
    # go-toolchain run. The name carries the calling job's id, so the cache key
    # (cache-xfer-go-build-<job>-<run_id>-<run_attempt>) is distinct per job and
    # concurrent jobs in one run (the standard linux + darwin pattern) can no
    # longer collide -- the old shared `go-build` name made the second finisher
    # fail its save with a 409 Conflict. Downstream jobs cache-download with
    # NO name (nameless self-discovery of the current run's hand-off -- the
    # preferred mode when the run saves only one hand-off; no need to know the
    # producing job's id), or with an explicit `go-build-<uploader job id>`
    # (e.g. go-build-linux) when the run carries several hand-offs and
    # discovery would be ambiguous. Note github.job is the job id and does NOT
    # distinguish matrix legs, so a single job's matrix legs still must not
    # invoke this action more than once per run.
    - name: Hand off build outputs (go-build-<job>)
      uses: wow-look-at-my/actions@cache-upload#latest
      with:
        name: go-build-${{ github.job }}
        path: ${{ inputs.working-directory }}/build

    - name: Deprecation notice (legacy go-build alias)
      shell: bash
      run: echo "::notice title=go-toolchain hand-off deprecation::The bare 'go-build' cache hand-off is deprecated; migrate downloads to nameless self-discovery (cache-download with no name) or to 'go-build-<uploader job id>' (this run also saved 'go-build-${{ github.job }}'). Proposed alias removal after 2026-08-01, once webhook-runner, buildhost, api-cli, github-state-mirror and publish-ghcr callers migrate."

    # Legacy alias: single-producer consumers (webhook-runner, buildhost,
    # api-cli, github-state-mirror, publish-ghcr callers) download the bare
    # name go-build; keep saving it until they migrate to
    # go-build-<uploader job id>. In multi-producer runs this bare key is
    # inherently racy (the second save hits an existing entry), so this step
    # tolerates failure instead of failing the job -- the collision-free
    # per-job hand-off above is the authoritative one. Remove this step once
    # the named consumers migrate.
    - name: Hand off build outputs (legacy go-build alias)
      continue-on-error: true
      uses: wow-look-at-my/actions@cache-upload#latest
      with:
        name: go-build
        path: ${{ inputs.working-directory }}/build

    - name: Analyze with CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:go

    # Composite `with:` blocks are static YAML, so autorelease_args cannot be
    # spread into the publish step dynamically: each recognized key is parsed
    # here into a step output and mapped onto an explicit buildhost-publish
    # input below. Unknown keys fail loudly (a typo must never be silently
    # ignored); an empty input leaves every output empty, and buildhost-publish
    # treats empty inputs as absent, so the publish stays byte-identical.
    - name: Parse autorelease_args
      if: inputs.autorelease == 'true'
      id: autorelease_args
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          const raw: string = "${{ inputs.autorelease_args }}";
          const known: string[] = ["create_service"];
          const out: Record<string, string> = {};
          for (const key of known) out[key] = "";
          for (const pair of raw.split(/[\s,]+/).filter((p: string) => p.length > 0)) {
            const eq = pair.indexOf("=");
            const key = eq < 0 ? pair : pair.slice(0, eq);
            const value = eq < 0 ? "" : pair.slice(eq + 1);
            if (!known.includes(key) || value === "") {
              core.setFailed(`autorelease_args: unrecognized or valueless entry '${pair}' (known keys: ${known.join(", ")}; form: key=value)`);
              return;
            }
            out[key] = value;
          }
          for (const key of known) core.setOutput(key, out[key]);

    - name: Auto-release to buildhost
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
      with:
        path: ${{ inputs.working-directory }}/build
        create_service: ${{ steps.autorelease_args.outputs.create_service }}
