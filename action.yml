name: 'Go Safe Build'
description: 'Build Go projects with coverage enforcement - fails if coverage is below threshold'
author: 'go-toolchain'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  json:
    description: 'Output coverage report as JSON'
    required: false
    default: 'false'
  generate:
    description: 'Run go:generate directives matching this hash'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the build'
    required: false
    default: '.'
  binary:
    description: 'Path to a pre-built go-toolchain binary (skips release download)'
    required: false
    default: ''
  os:
    description: 'Comma-separated list of target operating systems (e.g. linux,darwin,windows)'
    required: false
    default: 'linux,darwin,windows'
  arch:
    description: 'Comma-separated list of target architectures (e.g. amd64,arm64)'
    required: false
    default: 'amd64,arm64'
  cgo:
    description: 'Enable CGO (disabled by default for static binaries)'
    required: false
    default: 'false'
  autorelease:
    description: 'Automatically create a GitHub release when running on the default branch (requires contents: write permission)'
    required: false
    default: 'false'

outputs:
  coverage:
    description: 'Total coverage percentage'

runs:
  using: 'composite'
  steps:
    - name: Download go-toolchain
      if: inputs.binary == ''
      uses: wow-look-at-my/actions@download-release-binary#latest
      with:
        repo: wow-look-at-my/go-toolchain
        name: go-toolchain
        token: ${{ github.token }}

    - name: Install provided binary
      if: inputs.binary != ''
      shell: bash
      run: |
        chmod +x "${{ inputs.binary }}"
        sudo cp "${{ inputs.binary }}" /usr/local/bin/go-toolchain

    - name: Get go-toolchain version
      id: toolchain-version
      shell: bash
      run: echo "version=$(go-toolchain version 2>/dev/null | awk '/^Version:/{print $2; exit}')" >> "$GITHUB_OUTPUT"

    - name: Cache Go build cache and go-toolchain downloads
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/.cache/go-toolchain
          ~/go/pkg/mod
        key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain-version.outputs.version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain-version.outputs.version }}-
          go-toolchain-${{ runner.os }}-${{ runner.arch }}-

    - name: Run go-toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        ARGS=""
        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS="$ARGS --json"
        fi
        if [ -n "${{ inputs.generate }}" ]; then
          ARGS="$ARGS --generate ${{ inputs.generate }}"
        fi
        if [ -n "${{ inputs.os }}" ]; then
          ARGS="$ARGS --os ${{ inputs.os }}"
        fi
        if [ -n "${{ inputs.arch }}" ]; then
          ARGS="$ARGS --arch ${{ inputs.arch }}"
        fi
        if [ "${{ inputs.cgo }}" = "true" ]; then
          ARGS="$ARGS --cgo"
        fi
        go-toolchain matrix $ARGS

    - name: Auto-release
      if: inputs.autorelease == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="v0.0.$(git log -1 --format=%ct)"
        echo "==> Auto-releasing $TAG on default branch"
        go-toolchain release --tag "$TAG"
