name: 'Go Safe Build'
description: 'Build Go projects with coverage enforcement - fails if coverage is below threshold'
author: 'go-toolchain'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  json:
    description: 'Output coverage report as JSON'
    required: false
    default: 'false'
  generate:
    description: 'Run go:generate directives matching this hash'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the build'
    required: false
    default: '.'
  binary:
    description: 'Path to a pre-built go-toolchain binary (skips release download)'
    required: false
    default: ''
  os:
    description: 'Comma-separated list of target operating systems (e.g. linux,darwin,windows)'
    required: false
    default: 'linux,darwin,windows'
  arch:
    description: 'Comma-separated list of target architectures (e.g. amd64,arm64)'
    required: false
    default: 'amd64,arm64'
  cgo:
    description: 'Enable CGO (disabled by default for static binaries)'
    required: false
    default: 'false'
  autorelease:
    description: 'Automatically publish to buildhost on every branch push (requires id-token: write and actions: read permissions)'
    required: false
    default: 'true'
  permissions:
    description: 'Pass toJSON(permissions) from the calling workflow. Required for autorelease permission checking — the permissions context is unavailable inside composite actions.'
    required: false
    default: '{}'
  buildhost-url:
    description: 'Buildhost base URL'
    required: false
    default: 'https://pazer.build'
  upload-artifacts:
    description: 'Upload build/ directory as a GitHub Actions artifact after building'
    required: false
    default: 'true'
  timeout:
    description: 'Timeout in minutes for the go-toolchain build step'
    required: false
    default: '10'
  wait-ci:
    description: 'Wait for the latest go-toolchain CI run to finish before downloading the release binary'
    required: false
    default: 'false'
  codeql:
    description: 'Run CodeQL security-and-quality analysis around the build (requires security-events: write permission, and the consumer repo must NOT have GitHub default CodeQL setup enabled)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: wow-look-at-my/actions@secret-server#latest

    - name: Configure git for private repos
      if: env.PRIVATE_ORG_REPO_READ != ''
      shell: bash
      run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

    - name: Download go-toolchain from build artifact
      if: inputs.binary == '' && github.repository == 'wow-look-at-my/go-toolchain'
      uses: actions/download-artifact@v8
      with:
        name: go-toolchain-binary
        path: /tmp/go-toolchain-artifact

    - name: Install go-toolchain from build artifact
      if: inputs.binary == '' && github.repository == 'wow-look-at-my/go-toolchain'
      shell: bash
      run: |
        chmod +x /tmp/go-toolchain-artifact/go-toolchain
        sudo cp /tmp/go-toolchain-artifact/go-toolchain /usr/local/bin/go-toolchain

    - name: Wait for go-toolchain CI to finish
      if: inputs.binary == '' && github.repository != 'wow-look-at-my/go-toolchain' && inputs.wait-ci == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh extension install PazerOP/gh-wait-ci || true
        gh wait-ci -R wow-look-at-my/go-toolchain || true

    - name: Install go-toolchain
      if: inputs.binary == '' && github.repository != 'wow-look-at-my/go-toolchain'
      shell: bash
      run: |
        timeout --signal=KILL 60 npm install -g @buildhost/go-toolchain --registry="${{ inputs.buildhost-url }}/npm/" || true
        if ! go-toolchain version &>/dev/null; then
          echo "::warning::buildhost binary not usable, building from source"
          (cd "${{ github.action_path }}" && GOTOOLCHAIN=auto go install ./src)
          sudo cp "$(go env GOPATH)/bin/src" /usr/local/bin/go-toolchain
        fi

    - name: Install provided binary
      if: inputs.binary != ''
      shell: bash
      run: |
        chmod +x "${{ inputs.binary }}"
        sudo cp "${{ inputs.binary }}" /usr/local/bin/go-toolchain

    - name: Install timeout (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install coreutils
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Verify security-events write permission
      if: inputs.codeql == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        GH_API: ${{ github.api_url }}
      run: |
        set -euo pipefail
        # Probe the SARIF upload endpoint with an empty body.
        # 403 = workflow lacks security-events: write.
        # 422 = permission OK, body invalid (expected, no upload occurs).
        HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${GH_API}/repos/${GH_REPO}/code-scanning/sarifs" \
          -d '{}')
        if [ "${HTTP_CODE}" = "403" ]; then
          echo "::error title=Missing security-events: write::CodeQL is enabled but this workflow lacks 'security-events: write'. Add 'permissions: { security-events: write }' to the workflow, or pass codeql: 'false' to disable CodeQL."
          exit 1
        fi
        echo "security-events: write confirmed (probe HTTP ${HTTP_CODE})"

    - name: Verify autorelease permissions
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/actions@typescript#latest
      with:
        github: ${{ toJSON(github) }}
        script: |
          // The permissions context is not available inside composite actions, so
          // the caller must pass toJSON(permissions) as the 'permissions' input.
          // If omitted (default '{}'), the actions: read check is skipped with a warning.
          const permsJson = "${{ inputs.permissions }}";
          const perms = JSON.parse(permsJson);
          if (Object.keys(perms).length === 0) {
            core.warning("permissions input not provided; skipping actions: read check. Pass 'permissions: \${{ toJSON(permissions) }}' to enable it.");
          } else {
            const actionsPerm = perms.actions ?? '';
            if (actionsPerm !== 'read' && actionsPerm !== 'write') {
              core.setFailed("autorelease is enabled but this workflow lacks 'actions: read', needed to download build artifacts for buildhost publishing. Add it to the workflow permissions block, or pass autorelease: 'false' to disable publishing.");
            } else {
              core.info(`actions: read confirmed (permissions.actions = ${actionsPerm})`);
            }
          }
          const isForkPr = context.eventName === 'pull_request' &&
            (context.payload as any)?.pull_request?.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;
          if (isForkPr) {
            core.info("External fork PR: skipping id-token check (OIDC unavailable on external fork PRs)");
          } else if (!env.ACTIONS_ID_TOKEN_REQUEST_URL || !env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            core.setFailed("autorelease is enabled but this workflow lacks 'id-token: write', needed to mint an OIDC token for buildhost authentication. Add it to the workflow permissions block, or pass autorelease: 'false' to disable publishing.");
          } else {
            core.info('id-token: write confirmed (OIDC environment variables present)');
          }

    - name: Initialize CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: go
        build-mode: manual
        queries: security-and-quality

    - name: Run go-toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
        OTEL_SERVICE_NAME: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TIMEOUT_SECONDS=$(( ${{ inputs.timeout }} * 60 ))
        ARGS=""
        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS="$ARGS --json"
        fi
        if [ -n "${{ inputs.generate }}" ]; then
          ARGS="$ARGS --generate ${{ inputs.generate }}"
        fi
        if [ -n "${{ inputs.os }}" ]; then
          ARGS="$ARGS --os ${{ inputs.os }}"
        fi
        if [ -n "${{ inputs.arch }}" ]; then
          ARGS="$ARGS --arch ${{ inputs.arch }}"
        fi
        if [ "${{ inputs.cgo }}" = "true" ]; then
          ARGS="$ARGS --cgo"
        fi
        timeout "${TIMEOUT_SECONDS}" go-toolchain matrix $ARGS

    - name: Analyze with CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:go

    - name: Upload build artifacts
      if: inputs.upload-artifacts == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: go-build
        path: ${{ inputs.working-directory }}/build/

    - name: Auto-release to buildhost
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
