name: 'Go Safe Build'
description: 'Build Go projects with coverage enforcement - fails if coverage is below threshold'
author: 'go-toolchain'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  json:
    description: 'Output coverage report as JSON'
    required: false
    default: 'false'
  generate:
    description: 'Run go:generate directives matching this hash'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the build'
    required: false
    default: '.'
  binary:
    description: 'Path to a pre-built go-toolchain binary (skips release download)'
    required: false
    default: ''
  targets:
    description: >-
      Comma-separated wasm targets to add (wasm/js, wasm/wasip1, built with
      the gosmopolitan toolchain) plus the special value "cosmo" (one fat
      APE, the org's only native output). Empty (the default) builds the APE
      alone.
    required: false
    default: ''
  cosmo-platforms:
    description: >-
      Host platforms the fat APE must cover, as comma-separated os/arch pairs.
      One binary runs on all of them and publishes as ONE artifact carrying the
      whole set. "all" covers every platform the gosmopolitan fork can emit.
    required: false
    default: 'linux/amd64,darwin/arm64,windows/amd64'
  cgo:
    description: 'Enable CGO (disabled by default for static binaries)'
    required: false
    default: 'false'
  autorelease_args:
    description: >-
      Extra publish options forwarded to the buildhost publish, as
      whitespace- or comma-separated key=value pairs (e.g.
      "create_service=true"). Recognized keys: create_service (true|false --
      declare that the published binary runs as a background service; each
      download format materializes it, e.g. brew formulas gain a `service do`
      block and generated debs ship an auto-enabled systemd user unit) and
      version (the release version; a semver project refuses a publish
      without one).
      Unknown keys fail the build. Empty (the default) forwards nothing --
      the publish request is byte-identical to before this input existed.
      Ignored by a build that produces no executable binary, which publishes
      nothing.
    required: false
    default: ''
  apt-depends:
    description: >-
      Runtime prerequisites of the published binary, in Debian relationship
      syntax (e.g. 'bubblewrap | docker.io'). Forwarded to the buildhost
      publish as apt_depends, so the generated deb and the APT index carry a
      Depends line. buildhost refuses an invalid value, and the publish
      fails. Empty (the default) forwards nothing.
    required: false
    default: ''
  allow-source-build:
    description: 'Allow building go-toolchain from source when the buildhost binary is unavailable. When false (default), the build fails fast instead of silently falling back to a source build.'
    required: false
    default: 'false'
  timeout:
    description: 'Timeout in minutes for the go-toolchain build step'
    required: false
    default: '10'
  codeql:
    description: 'Run CodeQL security-and-quality analysis around the build (requires security-events: write permission, and the consumer repo must NOT have GitHub default CodeQL setup enabled)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: wow-look-at-my/actions@secret-server#latest

    - name: Configure git for private repos
      if: env.PRIVATE_ORG_REPO_READ != ''
      shell: bash
      run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

    # Lets the kernel start an APE, so a bare exec works. see docs/ACTION.md github.action_path is the host path in a container job; GITHUB_ACTION_PATH is the path the step's shell sees.
    - name: Register the APE binfmt handler
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/.github/scripts/register-ape-binfmt.sh"

    # cgo for GOOS=cosmo compiles C with cosmocc. This repository's own build also needs it: embedstd compiles runtime/cgo into the standard library the binary carries. see docs/ACTION.md
    - name: Install cosmocc
      if: inputs.cgo == 'true' || github.repository == 'wow-look-at-my/go-toolchain'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/.github/scripts/install-cosmocc.sh"

    # No path: runner.temp is the host path in a container job. The action resolves RUNNER_TEMP itself.
    - name: Download go-toolchain
      id: download
      if: inputs.binary == '' && github.repository != 'wow-look-at-my/go-toolchain'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: go-toolchain

    - name: Install go-toolchain
      if: inputs.binary == '' && github.repository != 'wow-look-at-my/go-toolchain'
      shell: bash
      run: |
        set -euo pipefail
        BIN_DIR="$RUNNER_TEMP/go-toolchain-bin"
        mkdir -p "${BIN_DIR}"
        mv "${{ steps.download.outputs.path }}" "${BIN_DIR}/go-toolchain"
        echo "${BIN_DIR}" >> "$GITHUB_PATH"
        # Capture the probe output: it names a crash or an unrunnable binary.
        if ! probe=$("${BIN_DIR}/go-toolchain" version 2>&1); then
          echo "buildhost go-toolchain not usable; probe output:"
          echo "${probe}"
          # A silent source build hides a buildhost outage. see docs/ACTION.md
          if [ "${{ inputs.allow-source-build }}" != "true" ]; then
            echo "::error::Could not install go-toolchain from buildhost and allow-source-build is not enabled. Set allow-source-build: 'true' to build from source instead."
            exit 1
          fi
          echo "::warning::buildhost binary not usable; building from source with the gosmopolitan toolchain (allow-source-build=true)"
          # Only the fork's go command builds this module, and it never contacts golang.org.
          case "$RUNNER_OS" in Linux) fork_os=linux ;; macOS) fork_os=darwin ;; Windows) fork_os=windows ;; *) echo "::error::no gosmopolitan toolchain for $RUNNER_OS"; exit 1 ;; esac
          case "$RUNNER_ARCH" in X64) fork_arch=amd64 ;; ARM64) fork_arch=arm64 ;; *) echo "::error::no gosmopolitan toolchain for $RUNNER_ARCH"; exit 1 ;; esac
          fork_root="$RUNNER_TEMP/gosmopolitan-source-build"
          mkdir -p "$fork_root"
          curl -fsSL --compressed "https://dl.pazer.build/gosmopolitan?branch=master&os=${fork_os}&arch=${fork_arch}" | tar -xz -C "$fork_root"
          (cd "$GITHUB_ACTION_PATH" && GOROOT="$fork_root/go" GOTOOLCHAIN=local GOTELEMETRY=off GOPROXY=direct GOSUMDB=off GONOSUMDB='*' GOFLAGS= CGO_ENABLED=0 \
            "$fork_root/go/bin/go" build -trimpath -o "${BIN_DIR}/go-toolchain" ./src)
        fi

    - name: Install provided binary
      if: inputs.binary != ''
      shell: bash
      run: |
        # Stage through /tmp and pre-run it. see docs/ACTION.md
        cp "${{ inputs.binary }}" /tmp/go-toolchain-provided
        chmod +x /tmp/go-toolchain-provided
        /tmp/go-toolchain-provided version || true
        sudo cp /tmp/go-toolchain-provided /usr/local/bin/go-toolchain

    - name: Install timeout (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install coreutils
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Require the security-events grant CodeQL needs
      if: inputs.codeql == 'true'
      uses: wow-look-at-my/actions@has-permission#latest
      with:
        permission: security-events

    - name: Initialize CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: go
        build-mode: manual
        queries: security-and-quality

    # A dependency's //go:generate directives run when it is fetched, and a missing generator fails the build. A runner with no go of its own uses the pipeline's go: the pipeline binary is the go command under the name go.
    - name: Install the generators a dependency's directives need
      shell: bash
      run: |
        set -euo pipefail
        # The pipeline binary is the go command these generators build with, whatever else the runner has on PATH. Its environment names no golang.org endpoint, downloads no toolchain and uploads no telemetry.
        export GOPROXY=direct GOSUMDB=off GONOSUMDB='*' GOTOOLCHAIN=local GOTELEMETRY=off
        mkdir -p "$RUNNER_TEMP/gt-go"
        ln -sf "$(command -v go-toolchain)" "$RUNNER_TEMP/gt-go/go"
        go="$RUNNER_TEMP/gt-go/go"
        bin="$("$go" env GOPATH)/bin"
        # Each generator comes from a GitHub checkout whose golang.org requirements point at GitHub, so the build resolves nothing through golang.org.
        bash "$GITHUB_ACTION_PATH/.github/scripts/build-from-github.sh" "$go" https://github.com/golang/tools v0.49.0 "$bin" cmd/stringer cmd/goyacc
        bash "$GITHUB_ACTION_PATH/.github/scripts/build-from-github.sh" "$go" https://github.com/golang/text v0.42.0 "$bin" cmd/gotext
        echo "$bin" >> "$GITHUB_PATH"

    # A composite `with:` block is static YAML. The build reads the version too, so this runs before it. see docs/ACTION.md
    - name: Parse autorelease_args
      id: autorelease_args
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          const raw: string = "${{ inputs.autorelease_args }}";
          const known: string[] = ["create_service", "version"];
          const out: Record<string, string> = {};
          for (const key of known) out[key] = "";
          for (const pair of raw.split(/[\s,]+/).filter((p: string) => p.length > 0)) {
            const eq = pair.indexOf("=");
            const key = eq < 0 ? pair : pair.slice(0, eq);
            const value = eq < 0 ? "" : pair.slice(eq + 1);
            if (!known.includes(key) || value === "") {
              core.setFailed(`autorelease_args: unrecognized or valueless entry '${pair}' (known keys: ${known.join(", ")}; form: key=value)`);
              return;
            }
            out[key] = value;
          }
          for (const key of known) core.setOutput(key, out[key]);

    # A copy of the shared cache's key index turns its 135 MB download into a fetch of the keys added since: 7.8 s -> 4.3 s on an empty cache.
    - name: Restore the shared cache's key index
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build/gocache-web-index-*.bin
          ~/.cache/go-build/gocache-web-index-*.bin.gen
          ~/Library/Caches/go-build/gocache-web-index-*.bin
          ~/Library/Caches/go-build/gocache-web-index-*.bin.gen
          ~/AppData/Local/go-build/gocache-web-index-*.bin
          ~/AppData/Local/go-build/gocache-web-index-*.bin.gen
        key: go-key-index-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: go-key-index-${{ runner.os }}-

    - name: Run go-toolchain
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GO_TOOLCHAIN_RELEASE_VERSION: ${{ steps.autorelease_args.outputs.version }}
      run: |
        set -euo pipefail
        TIMEOUT_SECONDS=$(( ${{ inputs.timeout }} * 60 ))
        ARGS=""
        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS="$ARGS --json"
        fi
        if [ -n "${{ inputs.generate }}" ]; then
          ARGS="$ARGS --generate ${{ inputs.generate }}"
        fi
        # The default builds a single fat APE. see docs/ACTION.md
        if [ -n "${{ inputs.targets }}" ]; then
          ARGS="$ARGS --targets ${{ inputs.targets }}"
        fi
        if [ -n "${{ inputs.cosmo-platforms }}" ]; then
          ARGS="$ARGS --cosmo-platforms ${{ inputs.cosmo-platforms }}"
        fi
        if [ "${{ inputs.cgo }}" = "true" ]; then
          ARGS="$ARGS --cgo"
        fi
        timeout "${TIMEOUT_SECONDS}" go-toolchain matrix $ARGS

    # The name must stay unique per job, per matrix leg, AND per build (working-directory). see docs/ACTION.md
    - name: Compute hand-off build identity
      id: build-id
      shell: bash
      run: |
        wd="${{ inputs.working-directory }}"
        id="$(printf '%s' "$wd" | tr '/.' '-' | sed -E 's/^-+//; s/-+$//')"
        [ -n "$id" ] || id="root"
        echo "id=$id" >> "$GITHUB_OUTPUT"

    - name: Hand off build outputs (go-build-<job>.<build>)
      uses: wow-look-at-my/actions@cache-upload#latest
      with:
        name: go-build-${{ github.job }}${{ matrix && format('.m{0}', strategy.job-index) || '' }}.b${{ steps.build-id.outputs.id }}
        path: ${{ inputs.working-directory }}/build

    - name: Analyze with CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:go

    # Every executable binary publishes. A build with none (a library module, or a wasm-only build with publishing opted out) has nothing buildhost can upload. see docs/ACTION.md
    - name: Select publishable artifacts
      id: publishable
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/.github/scripts/publishable-artifacts.sh" "${{ inputs.working-directory }}/build"

    - name: Require the id-token grant the publish needs
      if: steps.publishable.outputs.publish == 'true'
      uses: wow-look-at-my/actions@has-permission#latest
      with:
        permission: id-token

    - name: Require the deployments grant the publish needs
      if: steps.publishable.outputs.publish == 'true'
      uses: wow-look-at-my/actions@has-permission#latest
      with:
        permission: deployments

    - name: Require the artifact-metadata grant the publish needs
      if: steps.publishable.outputs.publish == 'true'
      uses: wow-look-at-my/actions@has-permission#latest
      with:
        permission: artifact-metadata

    # buildhost accepts only a lowercase project name. The build creates its release under the same name (publishProject).
    - name: Name the buildhost project
      id: project
      if: steps.publishable.outputs.publish == 'true'
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          core.setOutput("name", context.repo.repo.toLowerCase());

    # The release the build stamped its number into, else an explicit version from autorelease_args. see docs/RELEASE-STAMP.md
    - name: Auto-release to buildhost
      if: steps.publishable.outputs.publish == 'true'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
      with:
        project: ${{ steps.project.outputs.name }}
        path: ${{ inputs.working-directory }}/build
        version: ${{ steps.build.outputs.release_version || steps.autorelease_args.outputs.version }}
        create_service: ${{ steps.autorelease_args.outputs.create_service }}
        apt_depends: ${{ inputs.apt-depends }}
