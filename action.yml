name: 'Go Safe Build'
description: 'Build Go projects with coverage enforcement - fails if coverage is below threshold'
author: 'go-toolchain'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  json:
    description: 'Output coverage report as JSON'
    required: false
    default: 'false'
  generate:
    description: 'Run go:generate directives matching this hash'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for the build'
    required: false
    default: '.'
  binary:
    description: 'Path to a pre-built go-toolchain binary (skips release download)'
    required: false
    default: ''
  os:
    description: >-
      Comma-separated target operating systems (e.g. linux,darwin,windows).
      Setting this OR arch switches from the default single multi-platform APE
      to one native binary per platform. Empty (the default) builds the APE.
    required: false
    default: ''
  arch:
    description: >-
      Comma-separated target architectures (e.g. amd64,arm64). Setting this OR
      os switches from the default single multi-platform APE to one native
      binary per platform. Empty (the default) builds the APE.
    required: false
    default: ''
  targets:
    description: 'Comma-separated exact build targets, each an os/arch pair (e.g. darwin/amd64) or the special value "cosmo" (one fat APE built with the gosmopolitan toolchain). When non-empty this replaces the os/arch inputs.'
    required: false
    default: ''
  cosmo-platforms:
    description: >-
      Host platforms the fat APE must cover, as comma-separated os/arch pairs.
      One binary runs on all of them and publishes as ONE artifact carrying the
      whole set. "all" covers every platform the gosmopolitan fork can emit.
    required: false
    default: 'linux/amd64,darwin/arm64,windows/amd64'
  cgo:
    description: 'Enable CGO (disabled by default for static binaries)'
    required: false
    default: 'false'
  autorelease:
    description: 'Automatically publish to buildhost on every branch push (requires id-token: write, plus deployments: write and artifact-metadata: write -- the publish registers a GitHub Deployment and posts an artifact storage record as part of publishing, with no opt-out, and fails the build without either grant)'
    required: false
    default: 'true'
  autorelease_args:
    description: >-
      Extra publish options forwarded to the buildhost publish, as
      whitespace- or comma-separated key=value pairs (e.g.
      "create_service=true"). Recognized keys: create_service (true|false --
      declare that the published binary runs as a background service; each
      download format materializes it, e.g. brew formulas gain a `service do`
      block and generated debs ship an auto-enabled systemd user unit).
      Unknown keys fail the build. Empty (the default) forwards nothing --
      the publish request is byte-identical to before this input existed.
    required: false
    default: ''
  allow-source-build:
    description: 'Allow building go-toolchain from source when the buildhost binary is unavailable. When false (default), the build fails fast instead of silently falling back to a source build.'
    required: false
    default: 'false'
  timeout:
    description: 'Timeout in minutes for the go-toolchain build step'
    required: false
    default: '10'
  wait-ci:
    description: 'Wait for the latest go-toolchain CI run to finish before downloading the release binary'
    required: false
    default: 'false'
  codeql:
    description: 'Run CodeQL security-and-quality analysis around the build (requires security-events: write permission, and the consumer repo must NOT have GitHub default CodeQL setup enabled)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # A caller writing @latest or @master gets a frozen orphan tag, not a
    # moving pointer -- and the default branch is v1, so neither name tracks
    # anything. Nothing about that is visible from the calling workflow: the
    # build simply runs old code, and an input only newer versions declare is
    # dropped as an unknown `with:` key, which GitHub reports as a warning
    # nobody reads. One repo built against a months-old action that way and
    # only noticed when a `targets:` input silently did nothing.
    #
    # Refusing here turns that into a first-step failure naming the fix. A SHA
    # pin, v1, or a local ./ reference (empty action_ref) all pass.
    - name: Refuse a frozen ref
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        case "$ACTION_REF" in
          latest|master|main)
            echo "::error::go-toolchain was resolved from @${ACTION_REF}, a frozen tag that does not track development. Use 'wow-look-at-my/go-toolchain@v1' (the default branch) or pin a commit SHA."
            exit 1
            ;;
        esac

    - name: Refuse jobs named all-builds
      uses: wow-look-at-my/actions@no-all-builds-job#latest

    - uses: wow-look-at-my/actions@secret-server#latest

    - name: Configure git for private repos
      if: env.PRIVATE_ORG_REPO_READ != ''
      shell: bash
      run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

    - name: Wait for go-toolchain CI to finish
      if: inputs.binary == '' && github.repository != 'wow-look-at-my/go-toolchain' && inputs.wait-ci == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh extension install PazerOP/gh-wait-ci || true
        gh wait-ci -R wow-look-at-my/go-toolchain || true

    - name: Install go-toolchain
      if: inputs.binary == '' && github.repository != 'wow-look-at-my/go-toolchain'
      shell: bash
      run: |
        set -euo pipefail
        # --compressed lets buildhost stream its stored zstd blob as-is, and
        # buildhost normalizes the RUNNER_OS and RUNNER_ARCH aliases itself.
        URL="https://dl.pazer.build/go-toolchain?os=${RUNNER_OS}&arch=${RUNNER_ARCH}"
        # A runner-writable install dir, so a fat APE can assimilate itself on
        # any exec, and no step needs sudo or a root-owned file.
        BIN_DIR="${RUNNER_TEMP}/go-toolchain-bin"
        BIN="${BIN_DIR}/go-toolchain"
        mkdir -p "${BIN_DIR}"
        # The `if` keeps `set -e` from skipping the probe and source-build fallback.
        if curl -fL --compressed --connect-timeout 20 --max-time 120 -o "${BIN}" "${URL}"; then
          chmod +x "${BIN}"
        else
          echo "::warning::Download from buildhost failed (curl exit $?): ${URL}"
        fi
        # Capture the probe output: it names a 404, a missing file, or a crash.
        if ! probe=$("${BIN}" version 2>&1); then
          echo "buildhost go-toolchain (${URL}) not usable; probe output:"
          echo "${probe}"
          # Fail fast unless the caller has explicitly opted in to a source
          # build: a silent fallback hides buildhost outages and ships a
          # locally-compiled toolchain that may differ from the released one.
          if [ "${{ inputs.allow-source-build }}" != "true" ]; then
            echo "::error::Could not install go-toolchain from buildhost and allow-source-build is not enabled. Set allow-source-build: 'true' to build from source instead."
            exit 1
          fi
          echo "::warning::buildhost binary not usable; building from source (allow-source-build=true)"
          (cd "${{ github.action_path }}" && GOTOOLCHAIN=auto go install ./src)
          cp "$(go env GOPATH)/bin/src" "${BIN}"
        fi
        echo "${BIN_DIR}" >> "${GITHUB_PATH}"

    - name: Install provided binary
      if: inputs.binary != ''
      shell: bash
      run: |
        # A copy, so the caller's own file stays byte-identical.
        BIN_DIR="${RUNNER_TEMP}/go-toolchain-bin"
        mkdir -p "${BIN_DIR}"
        cp "${{ inputs.binary }}" "${BIN_DIR}/go-toolchain"
        chmod +x "${BIN_DIR}/go-toolchain"
        echo "${BIN_DIR}" >> "${GITHUB_PATH}"

    - name: Install timeout (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install coreutils
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Verify autorelease write permissions
      if: inputs.autorelease == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        GH_API: ${{ github.api_url }}
      run: |
        set -euo pipefail
        # An empty body creates nothing: 403 means the grant is missing, and
        # 422 means the permission is there and the body is rejected.
        HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${GH_API}/repos/${GH_REPO}/deployments" \
          -d '{}')
        if [ "${HTTP_CODE}" = "403" ]; then
          echo "::error title=Missing deployments: write::autorelease registers a GitHub Deployment as part of publishing. Add 'deployments: write' (and 'artifact-metadata: write', for the artifact storage record) to this job's permissions, or pass autorelease: 'false'. A job-level permissions block REPLACES the workflow-level one."
          exit 1
        fi
        echo "deployments: write confirmed (probe HTTP ${HTTP_CODE})"

    - name: Verify security-events write permission
      if: inputs.codeql == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        GH_API: ${{ github.api_url }}
      run: |
        set -euo pipefail
        # Probe the SARIF upload endpoint with an empty body.
        # 403 = workflow lacks security-events: write.
        # 422 = permission OK, body invalid (expected, no upload occurs).
        HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${GH_API}/repos/${GH_REPO}/code-scanning/sarifs" \
          -d '{}')
        if [ "${HTTP_CODE}" = "403" ]; then
          echo "::error title=Missing security-events: write::CodeQL is enabled but this workflow lacks 'security-events: write'. Add 'permissions: { security-events: write }' to the workflow, or pass codeql: 'false' to disable CodeQL."
          exit 1
        fi
        echo "security-events: write confirmed (probe HTTP ${HTTP_CODE})"

    - name: Verify autorelease permissions
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          // GitHub withholds OIDC on external fork PRs whatever the workflow declares, so a fork PR skips this rather than failing spuriously.
          const isForkPr = context.eventName === 'pull_request' &&
            (context.payload as any)?.pull_request?.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;
          if (isForkPr) {
            core.info("External fork PR: skipping id-token check (OIDC unavailable on external fork PRs)");
          } else if (!env.ACTIONS_ID_TOKEN_REQUEST_URL || !env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            core.setFailed("autorelease is enabled but this workflow lacks 'id-token: write', needed to mint an OIDC token for buildhost authentication. Add 'permissions: { id-token: write }', or pass autorelease: 'false' to disable publishing.");
          } else {
            core.info('id-token: write confirmed (OIDC environment variables present)');
          }

    - name: Initialize CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: go
        build-mode: manual
        queries: security-and-quality

    - name: Run go-toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
        OTEL_SERVICE_NAME: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TIMEOUT_SECONDS=$(( ${{ inputs.timeout }} * 60 ))
        ARGS=""
        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS="$ARGS --json"
        fi
        if [ -n "${{ inputs.generate }}" ]; then
          ARGS="$ARGS --generate ${{ inputs.generate }}"
        fi
        # No targets and no os/arch is the default: ONE fat APE covering
        # cosmo-platforms, published as one multi-platform artifact.
        if [ -n "${{ inputs.targets }}" ]; then
          # --targets replaces the --os x --arch matrix entirely.
          ARGS="$ARGS --targets ${{ inputs.targets }}"
        else
          if [ -n "${{ inputs.os }}" ]; then
            ARGS="$ARGS --os ${{ inputs.os }}"
          fi
          if [ -n "${{ inputs.arch }}" ]; then
            ARGS="$ARGS --arch ${{ inputs.arch }}"
          fi
        fi
        if [ -n "${{ inputs.cosmo-platforms }}" ]; then
          ARGS="$ARGS --cosmo-platforms ${{ inputs.cosmo-platforms }}"
        fi
        if [ "${{ inputs.cgo }}" = "true" ]; then
          ARGS="$ARGS --cgo"
        fi
        timeout "${TIMEOUT_SECONDS}" go-toolchain matrix $ARGS

    # Hand the build/ outputs off to later jobs in the same run via the org
    # cache-upload action (artifact-free replacement for actions/upload-artifact;
    # cache storage is free, artifact storage is billed). This runs on EVERY
    # go-toolchain run. The name carries the calling job's id, so the cache key
    # (cache-xfer-<run_id>-go-build-<job>-<run_attempt>) is distinct per job and
    # concurrent jobs in one run (the standard linux + darwin pattern) can no
    # longer collide -- the old shared `go-build` name made the second finisher
    # fail its save with a 409 Conflict. github.job alone does NOT distinguish
    # matrix legs, so for matrix jobs the name additionally carries the leg's
    # strategy.job-index as `.m<index>` (the matrix and strategy contexts ARE
    # evaluable inside composite steps -- the runner's action-manifest schema
    # allows both in step expressions, and for a non-matrix job `matrix` is
    # null, so the suffix collapses to the empty string and the non-matrix
    # name stays byte-identical to before). The dot makes the suffix
    # collision-proof against job ids: job ids cannot contain dots, so
    # `go-build-<jobA>.m<i>` can never equal -- or restore-prefix-shadow --
    # any `go-build-<jobB>`. job-index is 0-based in matrix definition order
    # and identical across re-run attempts of the same leg, which keeps
    # cache-download's cross-attempt fallback working. Downstream jobs
    # cache-download with NO name (nameless self-discovery of the current
    # run's hand-off -- the preferred mode when the run saves only one
    # hand-off; no need to know the producing job's id), or with an explicit
    # `go-build-<uploader job id>` / `go-build-<uploader job id>.m<index>`
    # (e.g. go-build-linux, go-build-build.m2) when the run carries several
    # hand-offs and discovery would be ambiguous -- a matrix producer is
    # always such a case, since each leg saves its own name.
    - name: Hand off build outputs (go-build-<job>)
      uses: wow-look-at-my/actions@cache-upload#latest
      with:
        name: go-build-${{ github.job }}${{ matrix && format('.m{0}', strategy.job-index) || '' }}
        path: ${{ inputs.working-directory }}/build

    - name: Deprecation notice (legacy go-build alias)
      shell: bash
      run: echo "::notice title=go-toolchain hand-off deprecation::The bare 'go-build' cache hand-off is deprecated; migrate downloads to nameless self-discovery (cache-download with no name) or to 'go-build-<uploader job id>' (this run also saved 'go-build-${{ github.job }}${{ matrix && format('.m{0}', strategy.job-index) || '' }}'). Proposed alias removal after 2026-08-01, once webhook-runner, buildhost, api-cli, github-state-mirror and publish-ghcr callers migrate."

    # Legacy alias: single-producer consumers (webhook-runner, buildhost,
    # api-cli, github-state-mirror, publish-ghcr callers) download the bare
    # name go-build; keep saving it until they migrate to
    # go-build-<uploader job id>. In multi-producer runs -- several
    # go-toolchain jobs, or the legs of one matrix job -- this bare key is
    # inherently racy (the second save hits an existing entry), so this step
    # tolerates failure instead of failing the job -- the collision-free
    # per-job/per-leg hand-off above is the authoritative one. Remove this
    # step once the named consumers migrate.
    - name: Hand off build outputs (legacy go-build alias)
      continue-on-error: true
      uses: wow-look-at-my/actions@cache-upload#latest
      with:
        name: go-build
        path: ${{ inputs.working-directory }}/build

    - name: Analyze with CodeQL
      if: inputs.codeql == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:go

    # Composite `with:` blocks are static YAML, so autorelease_args cannot be
    # spread into the publish step dynamically: each recognized key is parsed
    # here into a step output and mapped onto an explicit buildhost-publish
    # input below. Unknown keys fail loudly (a typo must never be silently
    # ignored); an empty input leaves every output empty, and buildhost-publish
    # treats empty inputs as absent, so the publish stays byte-identical.
    - name: Parse autorelease_args
      if: inputs.autorelease == 'true'
      id: autorelease_args
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          const raw: string = "${{ inputs.autorelease_args }}";
          const known: string[] = ["create_service"];
          const out: Record<string, string> = {};
          for (const key of known) out[key] = "";
          for (const pair of raw.split(/[\s,]+/).filter((p: string) => p.length > 0)) {
            const eq = pair.indexOf("=");
            const key = eq < 0 ? pair : pair.slice(0, eq);
            const value = eq < 0 ? "" : pair.slice(eq + 1);
            if (!known.includes(key) || value === "") {
              core.setFailed(`autorelease_args: unrecognized or valueless entry '${pair}' (known keys: ${known.join(", ")}; form: key=value)`);
              return;
            }
            out[key] = value;
          }
          for (const key of known) core.setOutput(key, out[key]);

    - name: Auto-release to buildhost
      if: inputs.autorelease == 'true'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
      with:
        path: ${{ inputs.working-directory }}/build
        create_service: ${{ steps.autorelease_args.outputs.create_service }}
