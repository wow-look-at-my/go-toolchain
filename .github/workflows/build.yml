name: Go Build

on:
  workflow_call:
    inputs:
      json:
        description: 'Output coverage report as JSON'
        required: false
        default: false
        type: boolean
      generate:
        description: 'Run go:generate directives matching this hash'
        required: false
        default: ''
        type: string
      working-directory:
        description: 'Working directory for the build'
        required: false
        default: '.'
        type: string
      os:
        description: 'Comma-separated list of target operating systems'
        required: false
        default: 'linux,darwin,windows'
        type: string
      arch:
        description: 'Comma-separated list of target architectures'
        required: false
        default: 'amd64,arm64'
        type: string
      cgo:
        description: 'Enable CGO'
        required: false
        default: false
        type: boolean
      autorelease:
        description: 'Automatically create a GitHub release on the default branch'
        required: false
        default: false
        type: boolean
      binary-artifact:
        description: 'Name of an uploaded artifact containing a go-toolchain binary (skips release download)'
        required: false
        default: ''
        type: string
      artifact-name:
        description: 'Name for the uploaded build artifact'
        required: false
        default: 'build-output'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download go-toolchain from artifact
        if: inputs.binary-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary-artifact }}
          path: /tmp/go-toolchain-artifact

      - name: Build
        uses: wow-look-at-my/go-toolchain@v1
        with:
          json: ${{ inputs.json && 'true' || 'false' }}
          generate: ${{ inputs.generate }}
          working-directory: ${{ inputs.working-directory }}
          binary: ${{ inputs.binary-artifact != '' && '/tmp/go-toolchain-artifact/go-toolchain' || '' }}
          os: ${{ inputs.os }}
          arch: ${{ inputs.arch }}
          cgo: ${{ inputs.cgo && 'true' || 'false' }}
          autorelease: ${{ inputs.autorelease && 'true' || 'false' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/build/
