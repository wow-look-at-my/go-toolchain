name: Go Build

on:
  workflow_call:
    inputs:
      json:
        description: 'Output coverage report as JSON'
        required: false
        default: false
        type: boolean
      generate:
        description: 'Run go:generate directives matching this hash'
        required: false
        default: ''
        type: string
      working-directory:
        description: 'Working directory for the build'
        required: false
        default: '.'
        type: string
      os:
        description: 'Comma-separated list of target operating systems'
        required: false
        default: 'linux,darwin,windows'
        type: string
      arch:
        description: 'Comma-separated list of target architectures'
        required: false
        default: 'amd64,arm64'
        type: string
      cgo:
        description: 'Enable CGO'
        required: false
        default: false
        type: boolean
      autorelease:
        description: 'Automatically create a GitHub release on the default branch'
        required: false
        default: false
        type: boolean
      binary-artifact:
        description: 'Name of an uploaded artifact containing a go-toolchain binary (skips release download)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  GOPROXY: goproxy.pazer.io
  GOSUMDB: gosumdb.pazer.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Configure netrc for Go proxy
        run: |
          cat >> ~/.netrc <<EOF
          machine goproxy.pazer.io login ${{ secrets.GOPROXY_USER }} password ${{ secrets.GOPROXY_PASSWORD }}
          EOF
          chmod 600 ~/.netrc

      - name: Download go-toolchain from artifact
        if: inputs.binary-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary-artifact }}
          path: /tmp/go-toolchain-artifact

      - name: Install go-toolchain from artifact
        if: inputs.binary-artifact != ''
        run: |
          chmod +x /tmp/go-toolchain-artifact/go-toolchain
          sudo cp /tmp/go-toolchain-artifact/go-toolchain /usr/local/bin/go-toolchain

      - name: Download go-toolchain from release
        if: inputs.binary-artifact == ''
        uses: wow-look-at-my/actions@download-release-binary#latest
        with:
          repo: wow-look-at-my/go-toolchain
          name: go-toolchain
          token: ${{ github.token }}

      - name: Run go-toolchain
        working-directory: ${{ inputs.working-directory }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GO_BUILDCACHE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GO_BUILDCACHE_ACCESS_KEY }}
          GOCACHE_S3_ENDPOINT: ${{ secrets.GO_BUILDCACHE_ENDPOINT }}
          GOCACHE_S3_REGION: ${{ secrets.GO_BUILDCACHE_REGION }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.json }}" = "true" ]; then
            ARGS="$ARGS --json"
          fi
          if [ -n "${{ inputs.generate }}" ]; then
            ARGS="$ARGS --generate ${{ inputs.generate }}"
          fi
          if [ -n "${{ inputs.os }}" ]; then
            ARGS="$ARGS --os ${{ inputs.os }}"
          fi
          if [ -n "${{ inputs.arch }}" ]; then
            ARGS="$ARGS --arch ${{ inputs.arch }}"
          fi
          if [ "${{ inputs.cgo }}" = "true" ]; then
            ARGS="$ARGS --cgo"
          fi
          go-toolchain matrix $ARGS

      - name: Auto-release
        if: inputs.autorelease && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.0.$(git log -1 --format=%ct)"
          echo "==> Auto-releasing $TAG on default branch"
          go-toolchain release --tag "$TAG"
