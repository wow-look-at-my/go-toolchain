name: line-proof

on:
  push:
    branches: ['claude/kind-archimedes-r87xzt']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: read

jobs:
  proof:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@secret-server#latest
      - name: Run the action's git step, then ls-remote private repos
        run: bash .github/line-proof.sh
