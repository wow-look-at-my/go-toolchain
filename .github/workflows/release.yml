name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  GOPROXY: direct
  GOSUMDB: off
  GONOSUMCHECK: '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cross-compile
        run: go run ./src matrix

      - name: Create release
        run: |
          TAG="v0.0.$(git log -1 --format=%ct)"
          gh release create "$TAG" build/go-toolchain_* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
