name: Release

on:
  push:
    branches: [v1]

permissions:
  contents: write

env:
  GOPROXY: direct
  GONOSUMDB: '*'
  GONOSUMCHECK: '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create tag
        id: tag
        run: |
          TAG="v0.0.$(git log -1 --format=%ct)"
          git tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        run: go run ./src matrix

      - name: Push tag
        run: git push origin "${{ steps.tag.outputs.tag }}"

      - name: Update rolling tags
        run: |
          git tag -f master HEAD
          git tag -f latest HEAD
          git push -f origin master latest

      - name: Create release
        run: gh release create "${{ steps.tag.outputs.tag }}" build/go-toolchain_* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
