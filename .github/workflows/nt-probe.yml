name: NT probe

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# A push runs it only on a probe branch; the inputs below are fixed until dispatch works from a non-default branch.
env:
  PROBE_HANDOFF_RUN: '35051764141'
  PROBE_COMMAND: measure
  PROBE_MINUTES: '10'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Runs on the NT host directly with a binary buildhost already has, so a probe never waits for host-build.
  probe:
    if: startsWith(github.ref_name, 'claude/nt-')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Configure Go proxy
        shell: bash
        run: |
          if [ -n "$GO_PROXY_CONFIG" ]; then
            proxy=$(echo "$GO_PROXY_CONFIG" | base64 -d | jq -r '.proxy // empty')
            if [ -n "$proxy" ]; then
              echo "GOPROXY=${proxy}|direct" >> "$GITHUB_ENV"
            fi
          fi

      # buildhost has published nothing since the linked toolchain landed, so the binary is a master host-build's hand-off, which cache-upload keyed by run.
      - name: Restore a master host-build's hand-off
        uses: actions/cache/restore@v4
        with:
          path: build/go-toolchain
          key: cache-xfer-${{ env.PROBE_HANDOFF_RUN }}-host-go-toolchain-1
          fail-on-cache-miss: true

      - name: Stage the binary
        shell: bash
        run: |
          set -euo pipefail
          find . -name go-toolchain -type f -not -path './_gosmopolitan/*'
          cp "$(find . -name go-toolchain -type f -not -path './_gosmopolitan/*' | head -1)" "$RUNNER_TEMP/gt-probe.exe"
          chmod +x "$RUNNER_TEMP/gt-probe.exe"
          "$RUNNER_TEMP/gt-probe.exe" version

      # The pipeline writes the fork checkout's generated files on its first run, which the direct test command needs.
      - name: Run the pipeline, bounded
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          minutes="$PROBE_MINUTES"
          if [ "$PROBE_COMMAND" = measure ]; then minutes=3; fi
          timeout -k 5 $(( minutes * 60 )) "$RUNNER_TEMP/gt-probe.exe" matrix --no-benchmark -v
          echo "pipeline exit=$?"

      - name: Measure the test command's stderr ahead of its first stdout byte
        if: env.PROBE_COMMAND == 'measure'
        shell: bash
        env:
          GO_TOOLCHAIN_LINKED_GO: "1"
          GOTOOLCHAIN: local
        run: |
          set -uo pipefail
          export GOROOT="$PWD/_gosmopolitan"
          node .github/scripts/measure-test-stderr.js "$RUNNER_TEMP/gt-probe.exe" $("$RUNNER_TEMP/gt-probe.exe" go list ./...)
