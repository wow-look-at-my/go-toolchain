name: CI

on:
  push:
    branches:
      - '**'

# A push supersedes the branch's running build, except on master, where run_id makes every run its own group so none is ever cancelled.
concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  id-token: write
  security-events: write
  actions: read
  checks: read
  # A buildhost publish registers a GitHub Deployment and records what it stored. Both are part of publishing and fail the job.
  deployments: write
  artifact-metadata: write

# The shared cache's look-ahead pool: the server sends the objects stored beside each hit ahead of the build asking, off the critical path (go-s3-server docs/look-ahead.md).
env:
  GO_TOOLCHAIN_CACHE_LOOKAHEAD: "16"

jobs:
  host-build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      # No persisted credentials: the header checkout leaves in the workspace names THIS repository, so every git question about another is asked as the wrong identity. The fork follows this branch at the commit the run locked, the same commit the pipeline's resolveForkCommit takes.
      - uses: wow-look-at-my/actions@parallel-checkout#latest
        with:
          persist-credentials: false
          submodule-branch: ${{ github.ref_name }}
          submodule-branch-lock: https://pazer.build

      - uses: wow-look-at-my/actions@secret-server#latest

      # The fork's last published release is the bootstrap compiler for its make.bash. Its go command carries the cache client in process, so go_bootstrap compiles from the shared cache. A stock Go cannot reach it.
      - name: Take the fork's release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
        with:
          # No fmt: a GOROOT is stored as a tar.gz, and repackaging wraps it again.
          project: gosmopolitan
          branch: master
          path: ${{ runner.temp }}/gosmopolitan.tar.gz
          executable: false

      - name: Install the fork's release as the bootstrap compiler
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/bootstrap"
          tar -xzf "${{ runner.temp }}/gosmopolitan.tar.gz" -C "${{ runner.temp }}/bootstrap"
          echo "GOROOT_BOOTSTRAP=${{ runner.temp }}/bootstrap/go" >> "$GITHUB_ENV"
          "${{ runner.temp }}/bootstrap/go/bin/go" version

      # The fork's cmd/dist and this pipeline's fork sync compile the APE loaders with these, from the fork's own pinned install.
      - name: Install the APE loader tools
        uses: ./_gosmopolitan/.github/actions/apeld-tools

      # The pipeline links the fork's go command, so the fork's own build is what earliest compiles it; it runs after the secrets because a CI run of the fork's go command refuses to build with no shared cache configured. see docs/CI.md
      - name: Build the bootstrap go command from the fork checkout
        working-directory: _gosmopolitan/src
        run: ./make.bash

      # This job builds from source, so it needs the org read token action.yml gives every consumer.
      - name: Configure git for private repos
        if: env.PRIVATE_ORG_REPO_READ != ''
        run: git config --global url."https://x-access-token:${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      # The dats phase sandboxes every suite command (dats' default), and the backend it picks... see docs/CI.md
      - name: Provision the sandbox backend (bubblewrap)
        uses: wow-look-at-my/actions@cached-apt#latest
        with:
          packages: bubblewrap

      # The probe is the point: a restored bwrap that cannot open a namespace here fails now rather than in the dats phase.
      - name: Prove bwrap builds a sandbox here
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      # The org module proxy is gone. Modules come from their own source, and the sumdb goes with the proxy that mirrored it. These are the values src/goenv.go already falls back to with no proxy configured.
      - name: Configure Go proxy
        run: |
          {
            echo "GOPROXY=direct"
            echo "GOSUMDB=off"
            echo "GONOSUMDB=*"
            echo "GONOSUMCHECK=*"
            echo "GOTOOLCHAIN=local"
            echo "GOTELEMETRY=off"
          } >> "$GITHUB_ENV"

      # golang.org/x/text and the tools fork both name stringer in a //go:generate directive the fetch runs, and a missing generator is a hard failure.
      - name: Install the generators
        uses: wow-look-at-my/actions@cached-run#latest
        with:
          key: generators
          paths: ~/go/bin
          run: |
            go="$PWD/_gosmopolitan/bin/go"
            # No GOOS, GOARCH or GOBIN: the fork targets cosmo, so each generator comes out an APE every host runs, and cmd/go reads that as a cross-compile, which refuses GOBIN and lands in a per-target subdirectory of GOPATH/bin.
            genbin="$("$go" env GOPATH)/bin/$("$go" env GOOS)_$("$go" env GOARCH)"
            mkdir -p "$genbin"
            # The fork's own go goes on PATH beside it: a dependency's generate directive starts `go` by name, and the runner's own go answers a GOROOT this owns.
            export PATH="$genbin:$PWD/_gosmopolitan/bin:$PATH"
            # Each generator is built from a GitHub checkout whose golang.org requirements point at GitHub, so no go command here resolves a path through golang.org. The org's own x/tools is what gopls and the analyzers here already build against. Completing x/text runs a directive that starts gotext, so gotext cannot come from a module fetch either.
            bash .github/scripts/build-from-github.sh "$go" https://github.com/wow-look-at-my/gosmopolitan_tools "" "$genbin" cmd/stringer cmd/goyacc
            bash .github/scripts/build-from-github.sh "$go" https://github.com/golang/text v0.42.0 "$genbin" cmd/gotext
            bash .github/scripts/build-from-github.sh "$go" https://github.com/protocolbuffers/protobuf-go v1.34.1 "$genbin" cmd/protoc-gen-go
            "$go" install github.com/mjibson/esc@v0.2.0
            # cached-run carries these with the paths, so a hit that skips this script still exports them.
            echo "$genbin" >> "$GITHUB_PATH"
            echo "$PWD/_gosmopolitan/bin" >> "$GITHUB_PATH"
            echo "GENBIN=$genbin" >> "$GITHUB_ENV"

      # protoc is a C++ binary, so go install cannot reach it. The release is pinned, which is the whole key: nothing this repo builds changes it.
      - name: Install protoc
        uses: wow-look-at-my/actions@cached-run#latest
        with:
          key: protoc-27.2
          paths: ~/protoc
          run: |
            protoc_version=27.2
            case "$RUNNER_OS-$RUNNER_ARCH" in
              Linux-X64) protoc_asset=linux-x86_64 ;;
              Linux-ARM64) protoc_asset=linux-aarch_64 ;;
              macOS-X64) protoc_asset=osx-x86_64 ;;
              macOS-ARM64) protoc_asset=osx-aarch_64 ;;
              Windows-X64) protoc_asset=win64 ;;
              *) echo "no protoc release for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
            esac
            curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-${protoc_asset}.zip"
            unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$HOME/protoc"
            chmod +x "$HOME/protoc/bin/protoc"
            echo "$HOME/protoc/bin" >> "$GITHUB_PATH"

      # The bootstrap pipeline is an APE the fork's own go command built from this tree, with the flags the pipeline builds itself with, so its compiler shares the passes' tool ID. see docs/CI.md
      - name: Build the bootstrap pipeline from the fork checkout
        run: |
          set -euo pipefail
          export GOROOT="$PWD/_gosmopolitan" GOTOOLCHAIN=local CGO_ENABLED=0
          "$GOROOT/bin/go" build -trimpath -o "${{ runner.temp }}/gt-bootstrap" ./src

      # Lets the kernel start an APE, so the pipeline and the test binaries it builds exec bare. see docs/ACTION.md
      - name: Register the APE binfmt handler
        run: bash .github/scripts/register-ape-binfmt.sh

      # embedstd compiles runtime/cgo for both architectures into the standard library the binary carries. see docs/CI.md
      - name: Install cosmocc
        run: bash .github/scripts/install-cosmocc.sh

      - name: Build and test
        env:
          # Dependency-graph submission needs a token with contents: write (granted at the workflow... see docs/CI.md
          GITHUB_TOKEN: ${{ github.token }}
          # Every go process logs what the shared cache tier did, timestamped, to a file instead of stderr. see docs/CI.md
          GOCACHEDEBUG: "1"
          GOCACHELOG: ${{ runner.temp }}/gocache.log
        # A shell starts the APE, since execve alone reads no shell header; generate approvals live in go.mod. see docs/PIPELINE.md
        run: sh "${{ runner.temp }}/gt-bootstrap"

      # The assertions live in the fixture, where an engineer can re-run them without pushing. see docs/CI.md
      - name: Check build profile
        uses: wow-look-at-my/dats@lkgb
        with:
          tests: .github/dats-fixtures/cache-profile.dats

      # A GitHub Actions artifact is banned org-wide, so the profile is published as a per-branch site instead.
      - name: Stage the build profile
        # Staged outside the checkout: a directory in the tree makes the next build's dirty-tree gate fail.
        run: |
          mkdir -p "${{ runner.temp }}/profile-site"
          cp build/profile.json "${{ runner.temp }}/profile-site/profile.json"
          # The Chrome trace a profiler opens. It lands beside the actiongraph dumps, never in build/.
          trace="${TMPDIR:-/tmp}/go-toolchain-profile/trace.json"
          if [ -f "$trace" ]; then cp "$trace" "${{ runner.temp }}/profile-site/trace.json"; fi

      - name: Publish the build profile
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@lkgb
        with:
          # A namespaced child of this repo's project.
          project: go-toolchain/profile
          branch: ${{ github.ref_name }}
          source_dir: ${{ runner.temp }}/profile-site
          comment: 'false'

      - name: Cache validation (second build)
        # build/ in THIS job is the fat APE. A shell starts it, which is the only way an APE starts --... see docs/CI.md
        env:
          # This second build runs inside the checkout, so it submits the dependency snapshot the first build did and needs the token for it. The run lock ahead of it names the run by GITHUB_REPOSITORY, GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT, and the store matches that name against the run the OIDC token was minted by, so blanking any of the three is a refused lock, not a skipped submission. see docs/CI.md
          GITHUB_TOKEN: ${{ github.token }}
          GOCACHEDEBUG: "1"
          GOCACHELOG: ${{ runner.temp }}/gocache.log
          # The test cache says per package why a result replayed or did not, which is what a slow second build needs answered. see docs/CI.md
          GODEBUG: gocachetest=1
        run: |
          cp build/go-toolchain /usr/local/bin/go-toolchain
          rm -rf build/
          start=$SECONDS
          go-toolchain
          elapsed=$(( SECONDS - start ))
          echo "Second build took ${elapsed}s"
          # see docs/CI.md
          if [ "$elapsed" -gt 600 ]; then
            echo "::error::Second build took ${elapsed}s (limit: 600s)"
            exit 1
          fi

      - name: Print the shared cache log
        if: always()
        run: cat "${{ runner.temp }}/gocache.log"

      - name: Upload host binary
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: host-go-toolchain
          path: build/go-toolchain

      # Each generator is an APE, so a single build of it runs on every host. The jobs that follow take these rather than compiling their own: this is the only host whose linked go can type-check against its embedded standard library, and it is the point of an APE that they need not.
      - name: Gather the generator APEs
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/generators"
          cp "$GENBIN"/* "${{ runner.temp }}/generators/"
          ls -la "${{ runner.temp }}/generators"

      - name: Upload the generators
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: generator-apes
          path: ${{ runner.temp }}/generators

  # Build + test via the composite action with NO target inputs, which is exactly what a... see docs/CI.md
  build:
    needs: host-build
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: wow-look-at-my/actions@parallel-checkout#latest
        with:
          persist-credentials: false
          submodule-branch: ${{ github.ref_name }}
          submodule-branch-lock: https://pazer.build

      # The dats phase sandboxes every suite command (dats' default), and the backend it picks... see docs/CI.md
      - name: Provision the sandbox backend (bubblewrap)
        uses: wow-look-at-my/actions@cached-apt#latest
        with:
          packages: bubblewrap

      # The probe is the point: a restored bwrap that cannot open a namespace here fails now rather than in the dats phase.
      - name: Prove bwrap builds a sandbox here
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      # Explicit name (host-build's "Upload host binary" hand-off): the strict cache-download... see docs/CI.md
      - name: Download host binary
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: build

      # host-build built these, and each is an APE, so this host runs them rather than compiling its own.
      - name: Take the generators host-build built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: generator-apes
          path: ${{ runner.temp }}/generators

      - name: The generators answer here
        run: |
          set -euo pipefail
          chmod +x "${{ runner.temp }}/generators/"* || true
          # Read it all, then print a line: a pipe into head kills the APE with SIGPIPE, which pipefail reads as a failure.
          said="$("${{ runner.temp }}/generators/stringer" --help 2>&1 || true)"
          printf '%s\n' "$said" | head -1
          # No pipe into head: it closes early, stringer dies of SIGPIPE, and pipefail reads that as the generator being broken.
          usage="$("${{ runner.temp }}/generators/stringer" --help 2>&1 || true)"
          printf '%s\n' "${usage%%$'\n'*}"
          echo "${{ runner.temp }}/generators" >> "$GITHUB_PATH"

      # The fork sync compiles the APE loaders cmd/link embeds with these.
      - name: Install the APE loader tools
        uses: ./_gosmopolitan/.github/actions/apeld-tools

      # The go-toolchain action itself cache-uploads build/ under the per-job name `go-build-<job... see docs/CI.md
      - uses: ./
        with:
          binary: build/go-toolchain
          # A build of this module compiles the fork's standard library from its checkout, in passes. see docs/CI.md
          timeout: '30'
          # The embedded dats sandboxes every suite command and refuses to run without one of these.
          apt-depends: 'bubblewrap | docker.io'

      # Consider a consumer's generator step. That step runs the published binary under the name go. A binary that cannot find its standard library fails here and all-builds never goes green on it.
      - name: The published binary runs as the go command
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/consumer-go"
          ln -sf "$PWD/build/go-toolchain" "${{ runner.temp }}/consumer-go/go"
          "${{ runner.temp }}/consumer-go/go" version
          "${{ runner.temp }}/consumer-go/go" env GOROOT GOPATH

  # The action as a consumer runs it. The build of its own commit, which `build` published in this run, downloaded and used to build a module.
  consumer:
    needs: build
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: wow-look-at-my/actions@parallel-checkout#latest
        with:
          persist-credentials: false
          submodules: false

      - name: Provision the sandbox backend (bubblewrap)
        uses: wow-look-at-my/actions@cached-apt#latest
        with:
          packages: bubblewrap

      - name: Let bwrap open a user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: ./
        with:
          working-directory: .github/consumer-fixture

  # Each non-linux host builds this repo's APE with the linux-built binary, so a difference in the output is the host and nothing else. see docs/CI.md
  build-everywhere:
    needs: host-build
    strategy:
      matrix:
        origin: [darwin, windows]
        # NT is the long pole; drop this exclude to build it, and the smoke matrix names when.
        exclude:
          - origin: windows
    # An include that named the runner would come back past the exclude above, since include is processed after it, so both follow from origin here.
    runs-on: ${{ matrix.origin == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 60
    env:
      # NT needs the suffix to exec what it copies.
      GT_APE: ${{ matrix.origin == 'windows' && 'gt-ape.exe' || 'gt-ape' }}
    steps:
      - uses: wow-look-at-my/actions@parallel-checkout#latest
        with:
          submodule-branch: ${{ github.ref_name }}
          submodule-branch-lock: https://pazer.build

      - uses: wow-look-at-my/actions@secret-server#latest

      # The org module proxy is gone. Modules come from their own source, and the sumdb goes with the proxy that mirrored it. These are the values src/goenv.go already falls back to with no proxy configured.
      - name: Configure Go proxy
        shell: bash
        run: |
          {
            echo "GOPROXY=direct"
            echo "GOSUMDB=off"
            echo "GONOSUMDB=*"
            echo "GONOSUMCHECK=*"
            echo "GOTOOLCHAIN=local"
            echo "GOTELEMETRY=off"
          } >> "$GITHUB_ENV"

      - name: Configure git for private repos
        if: env.PRIVATE_ORG_REPO_READ != ''
        shell: bash
        run: git config --global url."https://x-access-token:${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      # No if: the action installs nothing off Linux and succeeds, which is what darwin and NT want here.
      - name: Provision the sandbox backend (bubblewrap)
        uses: wow-look-at-my/actions@cached-apt#latest
        with:
          packages: bubblewrap

      - name: Let bwrap open a user namespace
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The NT leg gets no backend step: a WSL1 dockerd answers `docker version` and then fails every run in runc, which is worse than no daemon. see docs/DATS-PHASE.md

      - name: Download host binary
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: dist

      # Not `uses: ./`: the action installs with sudo, which a windows runner has not. see docs/CI.md
      - name: Stage the APE
        shell: bash
        run: |
          set -euo pipefail
          cp dist/go-toolchain "${{ runner.temp }}/$GT_APE"
          chmod +x "${{ runner.temp }}/$GT_APE"

      # host-build built these, and each is an APE, so darwin and NT run them rather than compiling their own. Only a linux host's linked go can type-check against its embedded standard library, and an APE is exactly what spares the others from needing to.
      - name: Take the generators host-build built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: generator-apes
          path: ${{ runner.temp }}/generators

      - name: The generators answer here
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/generators"
          chmod +x ./* || true
          # NT looks a command up by its .exe name, and an APE carries the PE header that name promises.
          if [ "${{ runner.os }}" = "Windows" ]; then
            for f in *; do
              case "$f" in *.exe | *.elf) continue ;; esac
              cp -- "$f" "$f.exe"
            done
          fi
          # Read it all, then print a line: a pipe into head kills the APE with SIGPIPE, which pipefail reads as a failure.
          said="$(./stringer --help 2>&1 || true)"
          printf '%s\n' "$said" | head -1
          echo "${{ runner.temp }}/generators" >> "$GITHUB_PATH"

      # The APE is that go command, so it goes there under that name.
      - name: Put the go command where GOROOT looks for it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _gosmopolitan/bin
          cp "${{ runner.temp }}/$GT_APE" _gosmopolitan/bin/go
          chmod +x _gosmopolitan/bin/go
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp _gosmopolitan/bin/go _gosmopolitan/bin/go.exe
          fi

      # The same compiler as the linux leg for runtime/cgo, or the embedded standard library and the APE differ by host.
      - name: Install cosmocc
        shell: bash
        run: bash .github/scripts/install-cosmocc.sh

      # The fork sync compiles the APE loaders cmd/link embeds with these, the same pinned releases as the linux leg.
      - name: Install the APE loader tools
        uses: ./_gosmopolitan/.github/actions/apeld-tools

      - name: Build this repo's APE here
        shell: bash
        env:
          # A build inside the checkout submits a dependency snapshot, and a missing token fails it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "${{ runner.temp }}/$GT_APE" matrix --no-benchmark

      - name: Hand off this host's APE
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: ape-${{ matrix.origin }}
          path: build/go-toolchain

  # The smoke jobs run A single host's APE on each of them. That says what every host ships only if every... see docs/CI.md
  identical:
    needs: [build, build-everywhere]
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # Only for the dats fixture below -- this job otherwise runs no repo code.
      - uses: wow-look-at-my/actions@parallel-checkout#latest
        with:
          submodules: false

      # ape/linux is `build`'s hand-off, the same bytes `publish` ships.
      - name: Download each host's APE
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: ape/linux
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-darwin
          path: ape/darwin
      # Skipped for as long as build-everywhere excludes the NT leg that uploads it. waiver-expires: 2026-09-28
      - if: ${{ false }}
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-windows
          path: ape/windows
      # The APE host-build reached, which `build` ran to produce ape/linux.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: ape/host

      - name: What each host handed off
        run: sha256sum ape/*/go-toolchain

      - name: Where the build job's APE differs from the host-build APE it ran
        run: bash .github/scripts/explain-mismatch.sh ape/host/go-toolchain ape/linux/go-toolchain

      # The cross-host pairs are the ones the fixture below actually compares. A red run says which bytes moved rather than only that some did.
      - name: Where each host's APE differs from the linux one
        run: |
          for host in darwin windows; do
            # A host whose leg is excluded uploaded nothing. The fixture below is what fails over a hand-off that should be here.
            if [ ! -f "ape/$host/go-toolchain" ]; then
              echo "=== no linux vs $host: that host handed off nothing"
              continue
            fi
            echo "=== linux vs $host"
            bash .github/scripts/explain-mismatch.sh ape/linux/go-toolchain "ape/$host/go-toolchain"
          done

      # A missing hand-off fails too: comparing the hosts that answered proves nothing. see docs/CI.md
      - name: Every host built the same bytes
        uses: wow-look-at-my/dats@lkgb
        with:
          tests: .github/dats-fixtures/identical.dats

      # The differing bytes, for a local diff after a red run.
      - name: Keep the APEs that differed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apes-that-differed
          path: |
            ape/host/go-toolchain
            ape/linux/go-toolchain
          compression-level: 1

  # One suite, every host: a host-specific answer is paired with uname inside the fixture. see docs/CI.md
  smoke:
    needs: [host-build, build]
    strategy:
      matrix:
        os: ${{ github.event.repository.visibility == 'public' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        # NT is the long pole; drop this exclude to run it. waiver-expires: 2026-09-28
        exclude:
          - os: windows-latest
    runs-on: ${{ (github.event.repository.visibility == 'public' || !contains(fromJSON('["ubuntu-latest"]'), matrix.os)) && matrix.os || vars.CI_RUNNER || matrix.os }}
    # A cold stdlib compile under the fork is slower on NT than on the other two hosts.
    timeout-minutes: 30
    steps:
      # Only for the dats fixtures in .github/dats-fixtures/ -- this job otherwise runs no repo code.
      - uses: wow-look-at-my/actions@parallel-checkout#latest
        with:
          submodules: false

      # For GO_BUILDCACHE_CONFIG alone: the fork refuses a CI build without it. see docs/CI.md
      - uses: wow-look-at-my/actions@secret-server#latest

      # Explicit name on purpose: by this point the run holds SEVERAL hand-offs (host-go-toolchain... see docs/CI.md
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: dist

      # The smoke's nested pipeline is a CI run, and the fork refuses one with no build cache to write to. see docs/CI.md
      - uses: wow-look-at-my/actions@secret-server#latest

      # The cgo smoke test compiles C with it, through the shipped APE.
      - name: Install cosmocc
        shell: bash
        run: bash .github/scripts/install-cosmocc.sh

      # Sandboxed like every other suite; the APE carries its compiler and standard library, so nothing is downloaded. see docs/CI.md
      - name: Smoke suite
        uses: wow-look-at-my/dats@lkgb
        env:
          # The org proxy wants auth to look up a module it has never seen. This job's throwaway module always is a single see docs/CI.md
          GO_PROXY_CONFIG: ""
        with:
          tests: .github/dats-fixtures/smoke.dats

  # The `build` job publishes, because the action publishes every executable binary it builds. This job outlives it to drop the run's hand-offs a single time the gates have read them.
  cleanup:
    needs: [identical, smoke, consumer]
    # A cancelled or failed run still has hand-offs to drop; without this the job is skipped and they are orphaned.
    if: always()
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - uses: wow-look-at-my/actions@cache-cleanup#latest
        if: always()
