name: CI

on:
  push:

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Build and test
        run: go run ./src
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-profiles
          path: /tmp/go-toolchain-profile/
          if-no-files-found: ignore

  # Test the composite action end-to-end using the binary we just built
  action-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: ./

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build/

  npm-publish:
    if: github.ref_type == 'branch'
    needs: [build, action-test]
    runs-on: ubuntu-latest
    env:
      NPM_REGISTRY: https://git.pazer.us/api/packages/wow-look-at-my/npm/
      NPM_SCOPE: '@wow-look-at-my'
      NPM_REPOSITORY_URL: https://git.pazer.us/wow-look-at-my/packages.git
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - uses: wow-look-at-my/actions@secret-server#latest

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Publish npm packages
        env:
          BRANCH: ${{ github.ref_name }}
          NPM_BUILD_DIR: build
        run: npx --yes tsx .github/npm-publish.ts
