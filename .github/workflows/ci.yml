name: CI

on:
  push:

permissions:
  contents: write
  id-token: write

env:
  GOPROXY: direct
  GONOSUMDB: '*'
  GONOSUMCHECK: '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build and test
        run: go run ./src
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GO_BUILDCACHE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GO_BUILDCACHE_ACCESS_KEY }}
          GOCACHE_S3_ENDPOINT: ${{ secrets.GO_BUILDCACHE_ENDPOINT }}
          GOCACHE_S3_REGION: ${{ secrets.GO_BUILDCACHE_REGION }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

  gha-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Remove system Go
        run: |
          sudo rm -f $(which -a go) 2>/dev/null || true
          sudo rm -rf /usr/local/go /opt/hostedtoolcache/go
          hash -r
          if command -v go &>/dev/null; then
            echo "FAIL: go still in PATH at $(which go)"
            exit 1
          fi
          echo "OK: go is not in PATH"

      - name: Download go-toolchain binary
        uses: actions/download-artifact@v4
        with:
          name: go-toolchain-binary

      - name: Verify binary matches current commit
        run: |
          chmod +x go-toolchain
          [ "$(./go-toolchain version json | jq -r .commit)" = "$GITHUB_SHA" ]

      - name: Build and test with action
        uses: ./
        with:
          binary: go-toolchain

      - name: Verify binary matches current commit
        run: |
          chmod +x go-toolchain
          [ "$(./build/go-toolchain_linux_amd64 version json | jq -r .commit)" = "$GITHUB_SHA" ]

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binaries
          path: |
            build/go-toolchain_*
            build/checksums.txt

  release:
    if: github.ref == 'refs/heads/v1'
    needs: [build, gha-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: go-toolchain-binaries
          path: build

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Determine tag
        id: tag
        run: |
          TAG="v0.0.$(git log -1 --format=%ct)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign checksums
        run: cosign sign-blob build/checksums.txt --yes --output-signature build/checksums.txt.sig --output-certificate build/checksums.txt.pem

      - name: Release
        run: |
          chmod +x build/go-toolchain_linux_amd64
          ./build/go-toolchain_linux_amd64 release --tag "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
