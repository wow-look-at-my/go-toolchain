name: CI

on:
  push:

permissions:
  contents: write
  id-token: write
  security-events: write
  actions: read
  checks: read

jobs:
  host-build:
    runs-on: ubuntu-latest
    outputs:
      cosmo-version: ${{ steps.cosmo.outputs.version }}
    steps:
      # No persisted credentials: the header checkout leaves in the workspace names THIS repository, so every git question about another one is asked as the wrong identity.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      # This job builds from source, so it needs the org read token action.yml gives every consumer.
      - name: Configure git for private repos
        if: env.PRIVATE_ORG_REPO_READ != ''
        run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      # The dats phase sandboxes every suite command (dats' default), and the backend it picks... see docs/CI.md
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      - name: Configure Go proxy
        run: |
          if [ -n "$GO_PROXY_CONFIG" ]; then
            proxy=$(echo "$GO_PROXY_CONFIG" | base64 -d | jq -r '.proxy // empty')
            if [ -n "$proxy" ]; then
              echo "GOPROXY=${proxy}|direct" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build and test
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}
          # Dependency-graph submission needs a token with contents: write (granted at the workflow... see docs/CI.md
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./src

      - name: Check build profile
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // Assert on the first build's per-action profile.
            const path = 'build/profile.json';
            if (!fs.existsSync(path)) {
              core.setFailed(`${path} missing — the build profile did not run`);
            } else {
              const p = JSON.parse(fs.readFileSync(path, 'utf-8'));
              core.info(`profile: ${p.total_actions} actions (${p.executed_actions} executed), ` +
                `${Number(p.cache_satisfied_pct).toFixed(0)}% cache-satisfied, ` +
                `outcomes=${JSON.stringify(p.cache_outcomes)}`);
              const web = p.web;
              if (!web) {
                core.info('no web tier configured; skipping web-cache assertions');
              } else {
                core.info(`web: hits=${web.hits} puts=${web.puts} index_keys=${web.index_keys} ` +
                  `authoritative=${web.index_authoritative} put_refused_modindex=${web.put_refused_modindex}`);
                core.info(`tripwires: checksum=${web.miss_checksum} buildid=${web.miss_buildid} modindex=${web.miss_modindex}`);
                // Any nonzero tripwire means the remote SERVED an object a client-side integrity guard had to refuse (checksum, build-id action, or module index), so the shared cache is carrying poison and needs inspecting. put_refused_modindex is deliberately NOT gated: refusing to UPLOAD module indexes is normal, and large on every cold run.
                if (web.miss_checksum > 0 || web.miss_buildid > 0 || web.miss_modindex > 0) {
                  core.setFailed(`cache poison tripwire: the remote served objects that failed integrity gates ` +
                    `(checksum=${web.miss_checksum} buildid=${web.miss_buildid} modindex=${web.miss_modindex}) — inspect the cache server`);
                }
                // A populated advertised index yielding ZERO web hits on a fresh runner's first build is the dead-remote signature: the tier is serving nothing.
                if (web.index_keys > 1000 && web.hits === 0) {
                  core.setFailed(`dead-remote signature: ${web.index_keys} advertised index keys but zero web hits ` +
                    `on the first build — the remote cache tier is serving nothing`);
                }
              }
            }

      - name: Cache validation (second build)
        # build/ in THIS job is the fat APE. A shell starts it, which is the only way an APE starts --... see docs/CI.md
        env:
          # The second build re-invokes go-toolchain, which also submits the dependency snapshot; give... see docs/CI.md
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp build/go-toolchain /usr/local/bin/go-toolchain
          rm -rf build/
          start=$SECONDS
          go-toolchain
          elapsed=$(( SECONDS - start ))
          echo "Second build took ${elapsed}s"
          # 60s is derived, not guessed. see docs/CI.md
          if [ "$elapsed" -gt 60 ]; then
            echo "::error::Second build took ${elapsed}s (limit: 60s)"
            exit 1
          fi

      - name: Upload host binary
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: host-go-toolchain
          path: build/go-toolchain

      # Comparing three hosts' APEs says something only if one compiler built them. see docs/CI.md
      - name: Pin the gosmopolitan release for this run
        id: cosmo
        run: |
          set -euo pipefail
          v="$(go-toolchain version cosmo)"
          case "$v" in
            v[0-9]*) ;;
            *) echo "::error::buildhost did not name a gosmopolitan release (got '$v'), so each host would resolve its own"; exit 1 ;;
          esac
          echo "resolved gosmopolitan $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # socketharness reproduces a coding agent's own tool-execution plumbing (a socketpair for a... see docs/CI.md
      - name: Cross-compile socketharness
        run: |
          mkdir -p harness
          GOOS=linux GOARCH=amd64 go build -o harness/socketharness-linux-amd64 .github/dats-fixtures/socketharness.go
          GOOS=darwin GOARCH=arm64 go build -o harness/socketharness-darwin-arm64 .github/dats-fixtures/socketharness.go

      - name: Upload socketharness binaries
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: socketharness-build
          path: harness

  # Build + test via the composite action with NO target inputs, which is exactly what a... see docs/CI.md
  build:
    needs: host-build
    runs-on: ubuntu-latest
    steps:
      # Same reason as host-build: a persisted credential for this repository answers for no other one.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      # The dats phase sandboxes every suite command (dats' default), and the backend it picks... see docs/CI.md
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      # Explicit name (host-build's "Upload host binary" hand-off): the strict cache-download... see docs/CI.md
      - name: Download host binary
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: build

      # The go-toolchain action itself cache-uploads build/ under the per-job name `go-build-<job... see docs/CI.md
      - uses: ./
        with:
          binary: build/go-toolchain
          autorelease: 'false'
          # The cosmo target additionally downloads + extracts the gosmopolitan toolchain and... see docs/CI.md
          timeout: '15'


  # Every host runs the SAME command, so a difference in the output is the host and nothing else. see docs/CI.md
  build-everywhere:
    needs: host-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - origin: linux
            runner: ubuntu-latest
            gt: gt-ape
          - origin: darwin
            runner: macos-latest
            gt: gt-ape
          - origin: windows
            runner: windows-latest
            gt: gt-ape.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Configure Go proxy
        shell: bash
        run: |
          if [ -n "$GO_PROXY_CONFIG" ]; then
            proxy=$(echo "$GO_PROXY_CONFIG" | base64 -d | jq -r '.proxy // empty')
            if [ -n "$proxy" ]; then
              echo "GOPROXY=${proxy}|direct" >> "$GITHUB_ENV"
            fi
          fi

      - name: Provision the sandbox backend (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Download host binary
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: dist

      # Not `uses: ./`: the action installs with sudo, which a windows runner has not. see docs/CI.md
      - name: Stage the APE
        shell: bash
        run: |
          set -euo pipefail
          cp dist/go-toolchain "$RUNNER_TEMP/${{ matrix.gt }}"
          chmod +x "$RUNNER_TEMP/${{ matrix.gt }}"

      - name: Build this repo's APE here
        shell: bash
        env:
          # One compiler for all three hosts; host-build resolved it. see docs/CI.md
          GO_TOOLCHAIN_COSMO_VERSION: ${{ needs.host-build.outputs.cosmo-version }}
          # A build inside the checkout submits a dependency snapshot, and a missing token fails it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/${{ matrix.gt }}" matrix --no-benchmark

      - name: Hand off this host's APE
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: ape-${{ matrix.origin }}
          path: build/go-toolchain

  # The smoke jobs run ONE host's APE on all three. That says what every host ships only if every... see docs/CI.md
  identical:
    needs: build-everywhere
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download each host's APE
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-linux
          path: ape/linux
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-darwin
          path: ape/darwin
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-windows
          path: ape/windows

      - name: Every host built the same bytes
        run: |
          set -uo pipefail
          for o in linux darwin windows; do
            if [ ! -f "ape/$o/go-toolchain" ]; then
              echo "::error::$o handed off no APE, so identity across hosts is untested, not proven"
              exit 1
            fi
          done
          sha256sum ape/*/go-toolchain
          rc=0
          for o in darwin windows; do
            cmp -s ape/linux/go-toolchain "ape/$o/go-toolchain" || {
              echo "::error::the $o build differs from the linux build: the APE is one binary for every host, so every host has to produce it. Compare with cmp -l; the build-ID notes are what -trimpath and -ldflags=-buildid= exist to close (docs/MATRIX.md)"
              rc=1
            }
          done
          exit $rc

  # Cross-OS smoke of the actual release artifacts: download the build-output hand-off the... see docs/CI.md
  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only for the dats fixture .github/dats-fixtures/*.dats copied in below -- this job otherwise... see docs/CI.md
      - uses: actions/checkout@v7

      # Explicit name on purpose: by this point the run holds SEVERAL hand-offs (host-go-toolchain... see docs/CI.md
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: dist

      # socketharness reproduces a coding agent's own tool-execution plumbing (a socketpair for a... see docs/CI.md
      - name: Download socketharness hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: socketharness-build
          path: harness

      # The outer run opts out so the pipeline test's own dats phase can sandbox the guard fixture... see docs/CI.md
      - name: Union smoke suite
        uses: wow-look-at-my/dats@master
        with:
          args: '--no-sandbox test .github/dats-fixtures/smoke.dats'

  # macos-latest is arm64, and darwin/arm64 is in the APE's platform set, so the APE is what... see docs/CI.md
  smoke-macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # Only for the dats fixture .github/dats-fixtures/*.dats copied in below -- this job otherwise... see docs/CI.md
      - uses: actions/checkout@v7

      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: dist

      # See smoke-linux for why this is a download, not a local build: no setup-go here,... see docs/CI.md
      - name: Download socketharness hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: socketharness-build
          path: harness

      # The outer run opts out so the pipeline test's own dats phase can sandbox the guard fixture... see docs/CI.md
      - name: Union smoke suite
        uses: wow-look-at-my/dats@master
        with:
          args: '--no-sandbox test .github/dats-fixtures/smoke.dats'

  smoke-windows:
    needs: build
    runs-on: windows-latest
    # A cold stdlib compile under the fork is slower on NT than on the other two hosts.
    timeout-minutes: 30
    steps:
      # Only for the dats fixture .github/dats-fixtures/*.dats copied in below -- this job otherwise... see docs/CI.md
      - uses: actions/checkout@v7

      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: dist

      # NT has no dats action (its binary lands under a name NT cannot start),
      # so dats runs by its plain filename here: the buildhost-download step
      # below already names it dats.exe.
      - name: Download dats
        id: dats
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
        with:
          project: dats
          path: dats.exe

      # NT has no bwrap and no seatbelt, and windows-latest's docker serves windows containers... see docs/CI.md
      - name: Union smoke suite
        shell: bash
        run: ./dats.exe --no-sandbox test .github/dats-fixtures/smoke.dats
  publish:
    needs: [identical, smoke-linux, smoke-macos, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
      deployments: write
      artifact-metadata: write
    steps:
      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - uses: actions/checkout@v7

      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: build/

      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          path: build

      - uses: wow-look-at-my/actions@cache-cleanup#latest
        if: always()
