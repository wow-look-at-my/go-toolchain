name: CI

on:
  push:

permissions:
  contents: write
  id-token: write
  security-events: write
  actions: read
  checks: read

jobs:
  host-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      # The dats phase sandboxes every suite command (dats' default), and the backend it picks... see docs/CI.md
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      - name: Configure Go proxy
        run: |
          if [ -n "$GO_PROXY_CONFIG" ]; then
            proxy=$(echo "$GO_PROXY_CONFIG" | base64 -d | jq -r '.proxy // empty')
            if [ -n "$proxy" ]; then
              echo "GOPROXY=${proxy}|direct" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build and test
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}
          # Dependency-graph submission needs a token with contents: write (granted at the workflow... see docs/CI.md
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./src

      - name: Check build profile
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // Assert on the first build's per-action profile.
            const path = 'build/profile.json';
            if (!fs.existsSync(path)) {
              core.setFailed(`${path} missing — the build profile did not run`);
            } else {
              const p = JSON.parse(fs.readFileSync(path, 'utf-8'));
              core.info(`profile: ${p.total_actions} actions (${p.executed_actions} executed), ` +
                `${Number(p.cache_satisfied_pct).toFixed(0)}% cache-satisfied, ` +
                `outcomes=${JSON.stringify(p.cache_outcomes)}`);
              const web = p.web;
              if (!web) {
                core.info('no web tier configured; skipping web-cache assertions');
              } else {
                core.info(`web: hits=${web.hits} puts=${web.puts} index_keys=${web.index_keys} ` +
                  `authoritative=${web.index_authoritative} put_refused_modindex=${web.put_refused_modindex}`);
                core.info(`tripwires: checksum=${web.miss_checksum} buildid=${web.miss_buildid} modindex=${web.miss_modindex}`);
                // Any nonzero tripwire means the remote SERVED an object a client-side integrity guard had to refuse (checksum, build-id action, or module index), so the shared cache is carrying poison and needs inspecting. put_refused_modindex is deliberately NOT gated: refusing to UPLOAD module indexes is normal, and large on every cold run.
                if (web.miss_checksum > 0 || web.miss_buildid > 0 || web.miss_modindex > 0) {
                  core.setFailed(`cache poison tripwire: the remote served objects that failed integrity gates ` +
                    `(checksum=${web.miss_checksum} buildid=${web.miss_buildid} modindex=${web.miss_modindex}) — inspect the cache server`);
                }
                // A populated advertised index yielding ZERO web hits on a fresh runner's first build is the dead-remote signature: the tier is serving nothing.
                if (web.index_keys > 1000 && web.hits === 0) {
                  core.setFailed(`dead-remote signature: ${web.index_keys} advertised index keys but zero web hits ` +
                    `on the first build — the remote cache tier is serving nothing`);
                }
              }
            }

      - name: Cache validation (second build)
        # build/ in THIS job is the fat APE. A shell starts it, which is the only way an APE starts --... see docs/CI.md
        env:
          # The second build re-invokes go-toolchain, which also submits the dependency snapshot; give... see docs/CI.md
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp build/go-toolchain /usr/local/bin/go-toolchain
          rm -rf build/
          start=$SECONDS
          go-toolchain
          elapsed=$(( SECONDS - start ))
          echo "Second build took ${elapsed}s"
          # 60s is derived, not guessed. see docs/CI.md
          if [ "$elapsed" -gt 60 ]; then
            echo "::error::Second build took ${elapsed}s (limit: 60s)"
            exit 1
          fi

      - name: Upload host binary
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: host-go-toolchain
          path: build/go-toolchain

      # socketharness reproduces a coding agent's own tool-execution plumbing (a socketpair for a... see docs/CI.md
      - name: Cross-compile socketharness
        run: |
          mkdir -p harness
          GOOS=linux GOARCH=amd64 go build -o harness/socketharness-linux-amd64 .github/dats-fixtures/socketharness.go
          GOOS=darwin GOARCH=arm64 go build -o harness/socketharness-darwin-arm64 .github/dats-fixtures/socketharness.go

      - name: Upload socketharness binaries
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: socketharness-build
          path: harness

  # Build + test via the composite action with NO target inputs, which is exactly what a... see docs/CI.md
  build:
    needs: host-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      # The dats phase sandboxes every suite command (dats' default), and the backend it picks... see docs/CI.md
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      # Explicit name (host-build's "Upload host binary" hand-off): the strict cache-download... see docs/CI.md
      - name: Download host binary
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: build

      # The go-toolchain action itself cache-uploads build/ under the per-job name `go-build-<job... see docs/CI.md
      - uses: ./
        with:
          binary: build/go-toolchain
          autorelease: 'false'
          # The cosmo target additionally downloads + extracts the gosmopolitan toolchain and... see docs/CI.md
          timeout: '15'

  # Cross-OS smoke of the actual release artifacts: download the build-output hand-off the... see docs/CI.md
  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only for the dats fixture .github/dats-fixtures/*.dats copied in below -- this job otherwise... see docs/CI.md
      - uses: actions/checkout@v7

      # Explicit name on purpose: by this point the run holds SEVERAL hand-offs (host-go-toolchain... see docs/CI.md
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: dist

      # socketharness reproduces a coding agent's own tool-execution plumbing (a socketpair for a... see docs/CI.md
      - name: Download socketharness hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: socketharness-build
          path: harness

      # Staging only. see docs/CI.md
      - name: Stage the APE
        run: |
          set -euo pipefail
          cp dist/go-toolchain "$RUNNER_TEMP/gt-ape"
          chmod +x "$RUNNER_TEMP/gt-ape"

      - name: Full pipeline in a tiny module
        env:
          # The smoke module is a synthetic consumer WITHOUT the org cache credentials (no secret-server... see docs/CI.md
          GO_TOOLCHAIN_CACHING_INTENTIONALLY_NOT_CONFIGURED: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smokemod"
          cd "$RUNNER_TEMP/smokemod"
          cat > go.mod <<'EOF'
          module example.com/apesmoke

          go 1.24

          require github.com/stretchr/testify v1.11.1
          EOF
          cat > main.go <<'EOF'
          // Package main is a tiny module used to smoke-test the published APE:
          // the full go-toolchain pipeline (tidy/vet/test/build) must work when
          // driven by the fat APE on this runner's OS.
          package main

          import "fmt"

          // Greeting returns the smoke-test greeting.
          func Greeting(name string) string {
          	return "hello, " + name
          }

          func main() {
          	fmt.Println(Greeting("cosmo"))
          }
          EOF
          cat > main_test.go <<'EOF'
          package main

          import (
          	"github.com/stretchr/testify/require"
          	"testing"
          )

          func TestGreeting(t *testing.T) {
          	got := Greeting("cosmo")
          	require.Equal(t, "hello, cosmo", got)
          }
          EOF
          # The agent output guard regression lives as a committed dats fixture (see smoke-macos), not... see docs/CI.md
          cp "$RUNNER_TEMP/gt-ape" ./gt-under-test
          cp "$GITHUB_WORKSPACE/harness/socketharness-linux-amd64" ./socketharness-under-test
          chmod +x ./socketharness-under-test
          mkdir -p dats
          cp "$GITHUB_WORKSPACE/.github/dats-fixtures/smoke-linux-agent-output-guard.dats" dats/agent-output-guard.dats
          # Full default pipeline: bootstraps an official Go toolchain if the runner's is too old, then... see docs/CI.md
          "$RUNNER_TEMP/gt-ape"

  # macos-latest is arm64, and darwin/arm64 is in the APE's platform set, so the APE is what... see docs/CI.md
  smoke-macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # Only for the dats fixture .github/dats-fixtures/*.dats copied in below -- this job otherwise... see docs/CI.md
      - uses: actions/checkout@v7

      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: dist

      # See smoke-linux for why this is a download, not a local build: no setup-go here,... see docs/CI.md
      - name: Download socketharness hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: socketharness-build
          path: harness

      # Staging only -- the assertions about this artifact live in... see docs/CI.md
      - name: Stage the APE
        run: |
          set -euo pipefail
          cp dist/go-toolchain "$RUNNER_TEMP/gt-ape"
          chmod +x "$RUNNER_TEMP/gt-ape"

      # One APE runs on several hosts, so everything host-specific it does -- toolchain archives,... see docs/CI.md
      - name: Host detection (outside the sandbox)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gt-ape" version host
          got=$("$RUNNER_TEMP/gt-ape" version host)
          case "$got" in
            *"host: darwin"*) ;;
            *) echo "::error::the APE detects the wrong host on macos-latest: ${got}"; exit 1 ;;
          esac
          case "$got" in
            *GUESSED*) echo "::error::host detection GUESSED on macos-latest: ${got}"; exit 1 ;;
          esac

      - name: Full pipeline with the APE
        env:
          # See smoke-linux: synthetic consumer without org cache credentials.
          GO_TOOLCHAIN_CACHING_INTENTIONALLY_NOT_CONFIGURED: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nativemod"
          cd "$RUNNER_TEMP/nativemod"
          cat > go.mod <<'EOF'
          module example.com/nativesmoke

          go 1.24

          require github.com/stretchr/testify v1.11.1
          EOF
          cat > main.go <<'EOF'
          // Package main is a tiny module used to smoke-test the published
          // APE: the full go-toolchain pipeline (tidy/vet/test/build) must
          // work when driven by the exact binary ARM64 mac users download.
          package main

          import "fmt"

          // Greeting returns the smoke-test greeting.
          func Greeting(name string) string {
          	return "hello, " + name
          }

          func main() {
          	fmt.Println(Greeting("mac"))
          }
          EOF
          cat > main_test.go <<'EOF'
          package main

          import (
          	"github.com/stretchr/testify/require"
          	"testing"
          )

          func TestGreeting(t *testing.T) {
          	got := Greeting("mac")
          	require.Equal(t, "hello, mac", got)
          }
          EOF
          # The agent output guard regression lives as a committed dats fixture... see docs/CI.md
          cp "$RUNNER_TEMP/gt-ape" ./gt-under-test
          cp "$GITHUB_WORKSPACE/harness/socketharness-darwin-arm64" ./socketharness-under-test
          chmod +x ./socketharness-under-test
          mkdir -p dats
          cp "$GITHUB_WORKSPACE/.github/dats-fixtures/smoke-macos-agent-output-guard.dats" dats/agent-output-guard.dats
          # Full default pipeline: macos-latest has no Go on PATH, so this is the job's first real... see docs/CI.md
          "$RUNNER_TEMP/gt-ape"

      # The same two socket cases the fixture above runs, but OUTSIDE dats -- the shape a real... see docs/CI.md
      - name: Agent output guard over a socket, unsandboxed
        if: always()
        run: |
          set -uo pipefail
          probe="$RUNNER_TEMP/sockprobe"
          rm -rf "$probe" && mkdir -p "$probe/run"
          # A go.mod in the RUN DIRECTORY ITSELF, or the child never reaches the guard: with no go on... see docs/CI.md
          printf 'module example.com/sockprobe\n\ngo 1.24\n' > "$probe/run/go.mod"
          # A copy per case, taken from the pristine artifact rather than from $RUNNER_TEMP/gt-ape: that... see docs/CI.md
          cp "$GITHUB_WORKSPACE/harness/socketharness-darwin-arm64" "$probe/run/harness"
          cp "$GITHUB_WORKSPACE/dist/go-toolchain" "$probe/run/gt-right"
          cp "$GITHUB_WORKSPACE/dist/go-toolchain" "$probe/run/gt-wrong"
          chmod +x "$probe/run/harness" "$probe/run/gt-right" "$probe/run/gt-wrong"
          cd "$probe/run"
          export GO_TOOLCHAIN_BUILDHOST_URL=http://127.0.0.1:1

          rc=0
          echo "--- reader IS the agent (expect HARNESS_GUARD_REFUSED=false) ---"
          ./harness ./gt-right > right.out 2> right.err || rc=$?
          echo "harness exit: $rc"; echo "stdout:"; cat right.out; echo "stderr:"; cat right.err

          wrc=0
          echo "--- reader is NOT the agent (expect HARNESS_GUARD_REFUSED=true) ---"
          ./harness --wrong-reader ./gt-wrong > wrong.out 2> wrong.err || wrc=$?
          echo "harness exit: $wrc"; echo "stdout:"; cat wrong.out; echo "stderr:"; cat wrong.err

          fail=0
          grep -q "HARNESS_GUARD_REFUSED=false" right.out || { echo "::error::guard refused a run whose socket reader IS the agent"; fail=1; }
          grep -q "HARNESS_GUARD_REFUSED=true"  wrong.out || { echo "::error::guard allowed a run whose socket reader is NOT the agent"; fail=1; }
          exit $fail

  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: dist

      # These assertions stay in the workflow because dats cannot run here: its sandbox backends are... see docs/CI.md
      - name: Run the APE PE payload
        shell: bash
        run: |
          set -euo pipefail
          # An APE is simultaneously a valid PE, whose embedded payload is a native windows/amd64 build. see docs/CI.md
          [ "$(head -c 6 dist/go-toolchain)" = "MZqFpD" ]
          mkdir -p smoke
          cp dist/go-toolchain smoke/gt-ape.exe
          ./smoke/gt-ape.exe version
          # Smoke contract (owner-ruled): gt must resolve the machine's EXISTING Go (windows-latest... see docs/CI.md
          ./smoke/gt-ape.exe --help
          # The full pipeline is deliberately NOT run on Windows: gobootstrap downloads... see docs/CI.md
  publish:
    needs: [smoke-linux, smoke-macos, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
      deployments: write
      artifact-metadata: write
    steps:
      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - uses: actions/checkout@v7

      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: build/

      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          path: build

      - uses: wow-look-at-my/actions@cache-cleanup#latest
        if: always()
