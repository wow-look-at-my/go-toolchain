name: CI

on:
  push:

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Build and test
        run: go run ./src
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-profiles
          path: /tmp/go-toolchain-profile/
          if-no-files-found: ignore

  # Test the composite action end-to-end using the binary we just built
  action-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: ./

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build/

  cache-validation:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: wow-look-at-my/actions@secret-server#latest
      - uses: actions/download-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/
      - run: chmod +x build/go-toolchain
      - name: Second build (cache validation)
        run: |
          build/go-toolchain 2>&1 | tee second-run.log
          miss=$(grep -oP 'miss \K[0-9]+' second-run.log | head -1)
          if [ "$miss" != "0" ]; then
            echo "::error::Cache misses on second build: $miss (expected 0)"
            exit 1
          fi

  publish-buildhost:
    if: github.ref_type == 'branch'
    needs: [build, action-test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
