name: CI

on:
  push:

permissions:
  contents: write
  id-token: write

env:
  GOPROXY: goproxy.pazer.io
  GOSUMDB: gosumdb.pazer.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets
        env:
          SECRET_SERVER_URL: https://secrets.pazer.io
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SECRET_SERVER_URL}" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Failed to obtain OIDC token"
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /tmp/secrets_response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "${SECRET_SERVER_URL}/github/v1/secrets")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Secret server returned HTTP ${HTTP_CODE}: $(cat /tmp/secrets_response.json)"
            exit 1
          fi
          SECRETS=$(cat /tmp/secrets_response.json)
          rm -f /tmp/secrets_response.json
          echo "::group::Secret keys received"
          echo "${SECRETS}" | jq -r 'keys[]'
          echo "::endgroup::"
          echo "${SECRETS}" | jq -r 'to_entries[] | .key' | while IFS= read -r key; do
            val=$(echo "${SECRETS}" | jq -r --arg k "$key" '.[$k]')
            echo "::add-mask::${val}"
            delimiter="ghadelimiter_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$val" "$delimiter" >> "$GITHUB_ENV"
          done

      - name: Configure git for private repos
        run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Configure netrc for Go proxy
        run: |
          cat >> ~/.netrc <<EOF
          machine goproxy.pazer.io login ${GOPROXY_USER} password ${GOPROXY_PASSWORD}
          EOF
          chmod 600 ~/.netrc

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Verify Go is latest stable
        run: |
          INSTALLED=$(go env GOVERSION)
          LATEST=$(curl -sf 'https://go.dev/dl/?mode=json' | jq -r '.[0].version')
          echo "Installed: $INSTALLED  Latest: $LATEST"
          if [ "$INSTALLED" != "$LATEST" ]; then
            echo "::error::Go version $INSTALLED does not match latest stable $LATEST"
            exit 1
          fi

      - name: Build and test
        run: go run ./src

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

  # Test the composite action by building this repo using the binary we just built
  action-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download go-toolchain binary
        uses: actions/download-artifact@v4
        with:
          name: go-toolchain-binary
          path: /tmp/go-toolchain-artifact

      - name: Build with action
        uses: ./
        with:
          binary: /tmp/go-toolchain-artifact/go-toolchain

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/

  release:
    if: github.ref == 'refs/heads/v1'
    needs: [build, action-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Determine tag
        id: tag
        run: |
          TAG="v0.0.$(git log -1 --format=%ct)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign checksums
        run: cosign sign-blob build/checksums.txt --yes --output-signature build/checksums.txt.sig --output-certificate build/checksums.txt.pem

      - name: Release
        run: |
          chmod +x build/go-toolchain_linux_amd64
          ./build/go-toolchain_linux_amd64 release --tag "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
