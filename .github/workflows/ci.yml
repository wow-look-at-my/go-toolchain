name: CI

on:
  push:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Build and test
        run: go run ./src
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-profiles
          path: /tmp/go-toolchain-profile/
          if-no-files-found: ignore

  # Test the composite action end-to-end using the binary we just built
  action-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: ./

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/

  release:
    if: github.ref == 'refs/heads/v1'
    needs: [build, action-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Determine tag
        id: tag
        run: |
          chmod +x build/go-toolchain_linux_amd64
          TAG=$(./build/go-toolchain_linux_amd64 version raw)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign checksums
        run: cosign sign-blob build/checksums.txt --yes --output-signature build/checksums.txt.sig --output-certificate build/checksums.txt.pem

      - name: Release
        run: |
          ./build/go-toolchain_linux_amd64 release --tag "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
