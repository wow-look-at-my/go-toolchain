name: CI

on:
  push:

permissions:
  contents: write
  id-token: write
  security-events: write
  actions: read
  checks: read

jobs:
  host-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      # The dats phase sandboxes every suite command (dats' default), and the
      # backend it picks decides what those commands can reach. Without
      # bubblewrap it falls back to docker, which runs them in a container --
      # no host Go for the bootstrap, and a ~350ms + image-pull tax per
      # command. Installing it is what dats' own error message tells you to do
      # on Linux, and the sysctl is the ubuntu-24.04 default that denies an
      # unprivileged user namespace (silently, until bwrap fails its probe).
      # The last line is the gate: an unusable bwrap fails the job here, with
      # its own error, instead of degrading to the fallback unnoticed.
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      - name: Configure Go proxy
        run: |
          if [ -n "$GO_PROXY_CONFIG" ]; then
            proxy=$(echo "$GO_PROXY_CONFIG" | base64 -d | jq -r '.proxy // empty')
            if [ -n "$proxy" ]; then
              echo "GOPROXY=${proxy}|direct" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build and test
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}
          # Dependency-graph submission needs a token with contents: write
          # (granted at the workflow level above). A bare `go run ./src` does
          # not inherit one, so pass it explicitly. Without it, submission can't
          # authenticate and fails loudly -- this is what wires the feature up.
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./src

      - name: Check build profile
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // Assert on the first build's per-action profile. Two classes of
            // failure are gated here:
            //   1. Poison tripwires: the remote SERVED an object a client-side
            //      integrity guard had to refuse (checksum / build-id action /
            //      module-index). Any nonzero value means the shared cache is
            //      carrying poison and needs inspection. (put_refused_modindex
            //      is NOT gated — refusing to UPLOAD module indexes is normal
            //      and large on every cold run.)
            //   2. Dead-remote signature: a populated advertised index
            //      (>1000 keys) yielding ZERO web hits on a fresh runner's
            //      first build — the remote tier is serving nothing.
            const path = 'build/profile.json';
            if (!fs.existsSync(path)) {
              core.setFailed(`${path} missing — the build profile did not run`);
            } else {
              const p = JSON.parse(fs.readFileSync(path, 'utf-8'));
              core.info(`profile: ${p.total_actions} actions (${p.executed_actions} executed), ` +
                `${Number(p.cache_satisfied_pct).toFixed(0)}% cache-satisfied, ` +
                `outcomes=${JSON.stringify(p.cache_outcomes)}`);
              const web = p.web;
              if (!web) {
                core.info('no web tier configured; skipping web-cache assertions');
              } else {
                core.info(`web: hits=${web.hits} puts=${web.puts} index_keys=${web.index_keys} ` +
                  `authoritative=${web.index_authoritative} put_refused_modindex=${web.put_refused_modindex}`);
                core.info(`tripwires: checksum=${web.miss_checksum} buildid=${web.miss_buildid} modindex=${web.miss_modindex}`);
                if (web.miss_checksum > 0 || web.miss_buildid > 0 || web.miss_modindex > 0) {
                  core.setFailed(`cache poison tripwire: the remote served objects that failed integrity gates ` +
                    `(checksum=${web.miss_checksum} buildid=${web.miss_buildid} modindex=${web.miss_modindex}) — inspect the cache server`);
                }
                if (web.index_keys > 1000 && web.hits === 0) {
                  core.setFailed(`dead-remote signature: ${web.index_keys} advertised index keys but zero web hits ` +
                    `on the first build — the remote cache tier is serving nothing`);
                }
              }
            }

      - name: Cache validation (second build)
        # build/ in THIS job is the host-built native linux/amd64 binary from
        # `go run ./src` above -- never the cosmo APE -- so executing it here is
        # safe (APEs self-assimilate on exec; the APE artifacts are built in
        # the `build` job and only ever executed as throwaway copies in the
        # smoke jobs below).
        env:
          # The second build re-invokes go-toolchain, which also submits the
          # dependency snapshot; give it the same token so it succeeds rather
          # than warning. Same job + correlator as the first submission, so it
          # replaces it (idempotent) rather than duplicating.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp build/go-toolchain /usr/local/bin/go-toolchain
          rm -rf build/
          start=$SECONDS
          go-toolchain
          elapsed=$(( SECONDS - start ))
          echo "Second build took ${elapsed}s"
          # Limit raised 30s -> 45s when the dats phase landed: the second
          # build now also runs the repo's CLI suite (~3-5s on top of a 26s
          # baseline); a broken cache still blows way past 45s.
          if [ "$elapsed" -gt 45 ]; then
            echo "::error::Second build took ${elapsed}s (limit: 45s)"
            exit 1
          fi

      - name: Upload host binary
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: host-go-toolchain
          path: build/go-toolchain

  # Build + test via the composite action, exercising the cosmo fat-APE target
  # exactly as consumers get it: `targets: cosmo,...` builds ONE GOOS=cosmo APE
  # (go-toolchain_cosmo_fat) and copies it onto the linux/amd64, linux/arm64
  # and windows/amd64 slot names; darwin/arm64, darwin/amd64 and windows/arm64
  # stay native cross-compiles (deliberate carve-outs: the pipeline WEDGES
  # under the APE on macos-arm64 -- runs 28739021382/28739520377, silent
  # >28-min hangs of a step that takes 26s on ubuntu -- so ARM64 macs keep a
  # native binary until that is fixed; the Intel-mac cosmo runtime is
  # unverified; the APE's PE payload is amd64-only).
  #
  # Publishing is NOT done here (autorelease: false): the dedicated `publish`
  # job below is the single publish path, gated on the three smoke jobs that
  # actually EXECUTE the APE artifacts on linux, macOS and Windows runners --
  # a broken APE can fail loudly but can never be released.
  build:
    needs: host-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      # The dats phase sandboxes every suite command (dats' default), and the
      # backend it picks decides what those commands can reach. Without
      # bubblewrap it falls back to docker, which runs them in a container --
      # no host Go for the bootstrap, and a ~350ms + image-pull tax per
      # command. Installing it is what dats' own error message tells you to do
      # on Linux, and the sysctl is the ubuntu-24.04 default that denies an
      # unprivileged user namespace (silently, until bwrap fails its probe).
      # The last line is the gate: an unusable bwrap fails the job here, with
      # its own error, instead of degrading to the fallback unnoticed.
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      # Explicit name (host-build's "Upload host binary" hand-off): the strict
      # cache-download hard-fails a nameless pick whenever the RUN holds
      # several hand-offs, and on re-run attempts the go-build-* hand-offs
      # from an earlier attempt's `./` action step already coexist with
      # host-go-toolchain (run-scoped keys with cross-attempt fallback), so
      # "only one saved at this point" only ever held on attempt 1.
      - name: Download host binary
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: build

      # The go-toolchain action itself cache-uploads build/ under the per-job
      # name `go-build-<job id>` on every run (unconditional) -- here that is
      # `go-build-build`, which the smoke-linux/macos/windows and publish
      # jobs below cache-download. The job id in the name keeps concurrent
      # same-run invocations (in other repos: the linux + darwin two-job
      # pattern) from colliding on one run-scoped key; there is no standalone
      # upload step here.
      - uses: ./
        with:
          binary: build/go-toolchain
          targets: 'cosmo,darwin/amd64,darwin/arm64,windows/arm64'
          autorelease: 'false'
          # The cosmo target additionally downloads + extracts the gosmopolitan
          # toolchain and cold-compiles its stdlib; the default 10 minutes is
          # too tight for a cold runner.
          timeout: '15'

  # Cross-OS smoke of the actual release artifacts: download the build-output
  # hand-off the `build` job uploaded (exactly what `publish` will ship) and RUN
  # the APE on each host OS. APEs self-assimilate on first exec -- they
  # rewrite their own header in place to the host's native format -- so every
  # job runs a throwaway copy, never the downloaded file itself. These jobs
  # have no checkout, so build/ lands in an otherwise empty workspace.
  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Explicit name on purpose: by this point the run holds SEVERAL
      # hand-offs (host-go-toolchain from host-build, the per-job
      # go-build-build, and the deprecated bare go-build alias), so a
      # nameless self-discovering download would be ambiguous here. Same
      # for smoke-macos/smoke-windows/publish below.
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: dist

      - name: Run the APE (linux/amd64 slot)
        run: |
          set -euo pipefail
          # The linux/amd64 slot must BE the fat APE (magic MZqFpD), not a
          # native ELF -- this is the consumer-visible contract of the migration.
          [ "$(head -c 6 dist/go-toolchain_linux_amd64)" = "MZqFpD" ]
          cp dist/go-toolchain_linux_amd64 "$RUNNER_TEMP/gt-ape"
          chmod +x "$RUNNER_TEMP/gt-ape"
          "$RUNNER_TEMP/gt-ape" version

      - name: Full pipeline in a tiny module
        env:
          # The smoke module is a synthetic consumer WITHOUT the org cache
          # credentials (no secret-server step here on purpose); this documented
          # knob downgrades the in-CI "caching not configured" error to a
          # warning. The repo's own host-build/build jobs keep the shared cache.
          GO_TOOLCHAIN_CACHING_INTENTIONALLY_NOT_CONFIGURED: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smokemod"
          cd "$RUNNER_TEMP/smokemod"
          cat > go.mod <<'EOF'
          module example.com/apesmoke

          go 1.24

          require github.com/stretchr/testify v1.11.1
          EOF
          cat > main.go <<'EOF'
          // Package main is a tiny module used to smoke-test the published APE:
          // the full go-toolchain pipeline (tidy/vet/test/build) must work when
          // driven by the fat APE on this runner's OS.
          package main

          import "fmt"

          // Greeting returns the smoke-test greeting.
          func Greeting(name string) string {
          	return "hello, " + name
          }

          func main() {
          	fmt.Println(Greeting("cosmo"))
          }
          EOF
          cat > main_test.go <<'EOF'
          package main

          import (
          	"github.com/stretchr/testify/require"
          	"testing"
          )

          func TestGreeting(t *testing.T) {
          	got := Greeting("cosmo")
          	require.Equal(t, "hello, cosmo", got)
          }
          EOF
          # --help runs INSIDE the module: go-toolchain bootstraps a Go
          # toolchain before dispatching any root-command invocation, and on a
          # runner without Go on PATH that needs a go.mod to pick a version.
          "$RUNNER_TEMP/gt-ape" --help
          # Full default pipeline: bootstraps an official Go toolchain if the
          # runner's is too old, then tidy/vet/test/coverage/build.
          "$RUNNER_TEMP/gt-ape"

      - name: agent output guard fires in the shipped APE
        run: |
          set -euo pipefail
          # Fresh throwaway copy: APEs self-assimilate on first exec, so never
          # run dist/ artifacts in place.
          cp dist/go-toolchain_linux_amd64 "$RUNNER_TEMP/gt-guard"
          chmod +x "$RUNNER_TEMP/gt-guard"
          cd "$RUNNER_TEMP/smokemod"
          # The released binaries ARE the cosmo APE, so the guard must fire in
          # THIS artifact — a GOOS=linux unit test cannot prove that (the guard
          # once shipped as a `_linux.go` no-op while unit tests stayed green).
          # CLAUDECODE is set per-command ONLY: the other smoke steps run the
          # real pipeline with runner-pipe stdout and must stay inert.
          # The previous step ran the full pipeline here, so the module's
          # binary is present: the guard must DELETE it. Discarding the output
          # and the exit code is exactly the case where a stale binary would
          # otherwise be run as proof of a build that never happened.
          [ -f build/apesmoke ]
          rc=0
          CLAUDECODE=1 timeout 120 "$RUNNER_TEMP/gt-guard" > /dev/null 2> guard-err.txt || rc=$?
          cat guard-err.txt
          [ "$rc" -eq 1 ]
          grep -q "refused to run" guard-err.txt
          # Asserted in the SHIPPED artifact, like the guard itself: the
          # deletion runs on the same linux||cosmo path (see staleoutputs.go).
          [ ! -e build/apesmoke ]
          grep -q "have been DELETED" guard-err.txt
          # The version exemption must stay intact.
          CLAUDECODE=1 timeout 120 "$RUNNER_TEMP/gt-guard" version > /dev/null

  # macos-latest is arm64. Two things are asserted here:
  #
  # 1. The NATIVE darwin/arm64 binary (what ARM64 macs are actually served --
  #    darwin/arm64 is a native carve-out, not an APE slot) runs the FULL
  #    default pipeline. This is the consumer-critical gate for mac users.
  #
  # 2. The APE still EXECUTES on darwin/arm64 (magic + `version` + `--help`
  #    from inside a module; the --help path bootstraps a real official Go
  #    toolchain first: go.dev download + extract + version probe under the
  #    APE loader). This is a REDUCED gate on purpose: the full pipeline
  #    WEDGES AT EXIT under the APE on macOS. Root cause (SIGQUIT goroutine
  #    dumps from the run-28742069477 debug job; see issue #276): the
  #    gosmopolitan runtime runs unix-socket fds in blocking mode with no
  #    netpoller on darwin hosts, so the cache daemon's Listener.Close
  #    deadlocks forever against its own Accept, blocked in raw accept4(2),
  #    which a close never wakes on XNU. Every pipeline phase (tidy/vet/test/
  #    build/bench) is green under the APE now that the GOCACHEPROG self-exec
  #    goes through a sh wrapper (the APE keeps its MZ magic on macOS -- no
  #    self-assimilation there -- so cmd/go's direct fork/exec of it ENOEXECs;
  #    fixed in cacheProgCommand). That exit deadlock is why darwin/arm64
  #    reverted to a native slot; the APE gate here proves the APE keeps
  #    working for the surface it still serves, and guards the day the fork
  #    fix restores the darwin/arm64 APE slot.
  smoke-macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: dist

      - name: Check slot formats + run the APE
        run: |
          set -euo pipefail
          # The darwin/arm64 slot must be a NATIVE Mach-O arm64 binary (the
          # macOS carve-out), NOT the APE.
          [ "$(head -c 4 dist/go-toolchain_darwin_arm64 | xxd -p)" = "cffaedfe" ]
          # The linux slots still carry the fat APE (magic MZqFpD); an APE is
          # an APE regardless of slot name -- its loader picks the arm64
          # payload at runtime -- so the linux/amd64 copy is what we execute
          # here as a throwaway.
          [ "$(head -c 6 dist/go-toolchain_linux_amd64)" = "MZqFpD" ]
          cp dist/go-toolchain_linux_amd64 "$RUNNER_TEMP/gt-ape"
          chmod +x "$RUNNER_TEMP/gt-ape"
          "$RUNNER_TEMP/gt-ape" version

      - name: 'APE reduced gate: bootstrap + --help in a tiny module'
        env:
          # See smoke-linux: synthetic consumer without org cache credentials.
          GO_TOOLCHAIN_CACHING_INTENTIONALLY_NOT_CONFIGURED: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apemod"
          cd "$RUNNER_TEMP/apemod"
          cat > go.mod <<'EOF'
          module example.com/apesmoke

          go 1.24
          EOF
          cat > main.go <<'EOF'
          package main

          func main() {}
          EOF
          # macos-latest has no Go on PATH; the bootstrap needs go.mod to pick
          # a version, downloads the official darwin/arm64 toolchain from
          # go.dev, extracts and probes it, and only then prints help.
          "$RUNNER_TEMP/gt-ape" --help

      - name: Full pipeline with the native darwin/arm64 binary
        env:
          # See smoke-linux: synthetic consumer without org cache credentials.
          GO_TOOLCHAIN_CACHING_INTENTIONALLY_NOT_CONFIGURED: '1'
        run: |
          set -euo pipefail
          # Native Mach-O binaries do not self-assimilate, but run a copy
          # anyway for symmetry with the APE smoke steps (and because
          # download-artifact drops the executable bit either way).
          cp dist/go-toolchain_darwin_arm64 "$RUNNER_TEMP/gt-native"
          chmod +x "$RUNNER_TEMP/gt-native"
          mkdir -p "$RUNNER_TEMP/nativemod"
          cd "$RUNNER_TEMP/nativemod"
          cat > go.mod <<'EOF'
          module example.com/nativesmoke

          go 1.24

          require github.com/stretchr/testify v1.11.1
          EOF
          cat > main.go <<'EOF'
          // Package main is a tiny module used to smoke-test the published
          // native darwin/arm64 binary: the full go-toolchain pipeline
          // (tidy/vet/test/build) must work when driven by the exact binary
          // ARM64 mac users download.
          package main

          import "fmt"

          // Greeting returns the smoke-test greeting.
          func Greeting(name string) string {
          	return "hello, " + name
          }

          func main() {
          	fmt.Println(Greeting("mac"))
          }
          EOF
          cat > main_test.go <<'EOF'
          package main

          import (
          	"github.com/stretchr/testify/require"
          	"testing"
          )

          func TestGreeting(t *testing.T) {
          	got := Greeting("mac")
          	require.Equal(t, "hello, mac", got)
          }
          EOF
          # Full default pipeline: reuses the Go toolchain the APE gate above
          # already bootstrapped (shared ~/.cache/go-toolchain), then
          # tidy/vet/test/coverage/build.
          "$RUNNER_TEMP/gt-native"

      - name: agent output guard fires in the native darwin/arm64 binary
        run: |
          set -euo pipefail
          # darwin has no /proc, so this is the one platform where the guard
          # could compile clean and still be a silent no-op at runtime — a
          # GOOS=darwin unit test proves nothing about the actual binary
          # running on actual darwin (see docs/AGENT-OUTPUT-GUARD.md).
          cd "$RUNNER_TEMP/nativemod"
          # The previous step ran the full pipeline here, so the module's
          # binary is present: the guard must DELETE it, same as smoke-linux.
          [ -f build/nativesmoke ]
          # No `timeout` here (unlike smoke-linux): it's GNU coreutils, absent
          # from macOS runners by default, and the guard aborts near-instantly
          # rather than running a build — nothing here can actually hang.
          rc=0
          OPENCODE=1 "$RUNNER_TEMP/gt-native" 2>&1 | cat > guard-out.txt || rc=$?
          cat guard-out.txt
          [ "$rc" -eq 1 ]
          grep -q "refused to run" guard-out.txt
          grep -qi "opencode" guard-out.txt
          [ ! -e build/nativesmoke ]
          grep -q "have been DELETED" guard-out.txt
          # The version exemption must stay intact.
          OPENCODE=1 "$RUNNER_TEMP/gt-native" version > /dev/null

  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: dist

      - name: Run the APE PE payload (windows/amd64 slot)
        shell: bash
        run: |
          set -euo pipefail
          # The windows/amd64 slot IS the fat APE: an APE is simultaneously a
          # valid PE, whose embedded payload is a native windows/amd64 build.
          [ "$(head -c 6 dist/go-toolchain_windows_amd64.exe)" = "MZqFpD" ]
          mkdir -p smoke
          cp dist/go-toolchain_windows_amd64.exe smoke/gt-ape.exe
          ./smoke/gt-ape.exe version
          # Smoke contract (owner-ruled): gt must resolve the machine's
          # EXISTING Go (windows-latest ships an image-default Go) via its
          # own exec.LookPath on the NT side and bootstrap it -- broken
          # pre-gosmopolitan#63 (unix-style ':' PATH walk with no .exe
          # suffixing on NT hosts), fixed in fork v237+. Do NOT provision Go
          # in this job (no setup-go -- that bypasses the bootstrap
          # requirement); do NOT exempt commands from the bootstrap. If the
          # image drops Go, the red is honest -- escalate to the owner.
          ./smoke/gt-ape.exe --help
          # The full pipeline is deliberately NOT run on Windows: gobootstrap
          # downloads go<version>.<os>-<arch>.tar.gz, which go.dev does not
          # serve for windows (windows archives are .zip) -- a pre-existing
          # bootstrap gap independent of the APE migration.

  # The single publish path. Gated on the cross-OS smoke jobs above so a build
  # whose APE cannot actually run on linux/macOS/Windows is never released.
  # Downloads the same build-output hand-off the smoke jobs ran and publishes
  # build/ straight to buildhost (no GHA artifact involved), authenticating
  # with a GHA OIDC token (hence id-token: write).
  publish:
    needs: [smoke-linux, smoke-macos, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
      deployments: write
      artifact-metadata: write
    steps:
      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build
          path: build/

      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          path: build

      - uses: wow-look-at-my/actions@cache-cleanup#latest
        if: always()
