name: CI

on:
  push:

permissions:
  contents: read

env:
  GOPROXY: direct
  GONOSUMDB: '*'
  GONOSUMCHECK: '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build and test
        run: go run ./src

  gha-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Build and test with action
        uses: ./

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binaries
          path: build/go-toolchain_*

  bootstrap-test:
    name: Bootstrap (no Go in PATH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Set up Go (for building go-toolchain itself)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build go-toolchain binary
        run: go build -o go-toolchain ./src

      - name: Remove Go from PATH and run bootstrap
        run: |
          set -euo pipefail
          # Save binary outside GOROOT
          cp go-toolchain /usr/local/bin/go-toolchain

          # Remove system go binaries while we still have sudo in PATH
          which -a go || true
          sudo rm -f /usr/local/bin/go /usr/bin/go /bin/go

          # Remove every directory containing a 'go' binary from PATH
          NEW_PATH=""
          IFS=':' read -ra DIRS <<< "$PATH"
          for dir in "${DIRS[@]}"; do
            if [ ! -x "$dir/go" ]; then
              NEW_PATH="${NEW_PATH:+$NEW_PATH:}$dir"
            else
              echo "Removing from PATH: $dir (contains go binary)"
            fi
          done
          export PATH="$NEW_PATH"
          unset GOROOT
          unset GOPATH

          # Verify go is gone
          if command -v go &>/dev/null; then
            echo "FAIL: go still in PATH at $(which go)"
            exit 1
          fi
          echo "OK: go is not in PATH"

          # go-toolchain should bootstrap Go from go.dev and succeed
          /usr/local/bin/go-toolchain --help
