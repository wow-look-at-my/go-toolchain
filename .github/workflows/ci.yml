name: CI

on:
  push:

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Build and test
        run: go run ./src
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-profiles
          path: /tmp/go-toolchain-profile/
          if-no-files-found: ignore

  # Test the composite action end-to-end using the binary we just built
  action-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: ./

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/

  release:
    if: github.ref == 'refs/heads/v1'
    needs: [build, action-test]
    runs-on: ubuntu-latest
    env:
      # Gitea npm registry. The owner is the Gitea user/org that hosts the
      # packages; the scope is what consumers reference in package.json.
      NPM_REGISTRY: https://git.pazer.us/api/packages/pazer/npm/
      NPM_SCOPE: '@pazer'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Determine tag
        id: tag
        run: |
          chmod +x build/go-toolchain_linux_amd64
          TAG=$(./build/go-toolchain_linux_amd64 version raw)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign checksums
        run: cosign sign-blob build/checksums.txt --yes --output-signature build/checksums.txt.sig --output-certificate build/checksums.txt.pem

      - name: Release
        run: |
          ./build/go-toolchain_linux_amd64 release --tag "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure npm registry auth
        # GITEA_NPM_TOKEN is published into $GITHUB_ENV by the secret-server
        # step earlier in this job; rename on the secret server if you prefer
        # a different key.
        run: |
          set -euo pipefail
          if [ -z "${GITEA_NPM_TOKEN:-}" ]; then
            echo "::error::GITEA_NPM_TOKEN is not set; configure it on the secret server"
            exit 1
          fi
          # Strip protocol so the .npmrc auth key matches npm's expected form.
          host_path="${NPM_REGISTRY#https:}"
          {
            echo "${NPM_SCOPE}:registry=${NPM_REGISTRY}"
            echo "${host_path}:_authToken=${GITEA_NPM_TOKEN}"
            echo "${host_path}:always-auth=true"
          } > "${HOME}/.npmrc"

      - name: Publish npm packages
        run: |
          ./build/go-toolchain_linux_amd64 npm-publish \
            --registry "${NPM_REGISTRY}" \
            --scope "${NPM_SCOPE}" \
            --tag "${{ steps.tag.outputs.tag }}"
