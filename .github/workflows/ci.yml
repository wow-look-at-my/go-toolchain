name: CI

on:
  push:

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Build and test
        run: go run ./src
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-profiles
          path: /tmp/go-toolchain-profile/
          if-no-files-found: ignore

  # Test the composite action end-to-end using the binary we just built
  action-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: ./

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/

  release:
    if: github.ref == 'refs/heads/v1'
    needs: [build, action-test]
    runs-on: ubuntu-latest
    env:
      # Gitea npm registry. The owner is the Gitea user/org that hosts the
      # packages; the scope is what consumers reference in package.json.
      NPM_REGISTRY: https://git.pazer.us/api/packages/wow-look-at-my/npm/
      NPM_SCOPE: '@wow-look-at-my'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Determine tag
        id: tag
        run: |
          chmod +x build/go-toolchain_linux_amd64
          TAG=$(./build/go-toolchain_linux_amd64 version raw)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign checksums
        run: cosign sign-blob build/checksums.txt --yes --output-signature build/checksums.txt.sig --output-certificate build/checksums.txt.pem

      - name: Release
        run: |
          ./build/go-toolchain_linux_amd64 release --tag "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure npm registry auth
        run: |
          set -euo pipefail
          # Strip protocol so the .npmrc auth key matches npm's expected form.
          host_path="${NPM_REGISTRY#https:}"
          {
            echo "${NPM_SCOPE}:registry=${NPM_REGISTRY}"
            echo "${host_path}:_authToken=${GITEA_NPM_TOKEN}"
            echo "${host_path}:always-auth=true"
          } > "${HOME}/.npmrc"

      - name: Publish npm packages
        run: .github/npm-publish.sh "${TAG#v}"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          NPM_BUILD_DIR: build

  # Publish per-branch prerelease packages so consumers can install
  # `@wow-look-at-my/go-toolchain@branch-<sanitized-name>` to track a branch.
  # The version baked in is `<base>-<sanitized-branch>`, which sorts as a
  # semver prerelease (always lower than the equivalent <base>) and is
  # published under a per-branch dist-tag so it never wins `latest`.
  npm-branch:
    if: github.ref_type == 'branch' && github.ref_name != 'v1'
    needs: [build, action-test]
    runs-on: ubuntu-latest
    env:
      NPM_REGISTRY: https://git.pazer.us/api/packages/wow-look-at-my/npm/
      NPM_SCOPE: '@wow-look-at-my'
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - uses: wow-look-at-my/actions@secret-server#latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish branch npm packages
        env:
          BRANCH: ${{ github.ref_name }}
          NPM_BUILD_DIR: build
        run: |
          set -euo pipefail
          chmod +x build/go-toolchain_linux_amd64
          BASE=$(./build/go-toolchain_linux_amd64 version raw)
          BASE_NUM="${BASE#v}"
          SANITIZED=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9.]+#-#g; s#-+#-#g; s#^-+##; s#-+$##')
          if [ -z "$SANITIZED" ]; then SANITIZED="branch"; fi
          host_path="${NPM_REGISTRY#https:}"
          {
            echo "${NPM_SCOPE}:registry=${NPM_REGISTRY}"
            echo "${host_path}:_authToken=${GITEA_NPM_TOKEN}"
            echo "${host_path}:always-auth=true"
          } > "${HOME}/.npmrc"
          .github/npm-publish.sh "${BASE_NUM}-${SANITIZED}" "branch-${SANITIZED}"
