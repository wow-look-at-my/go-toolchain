name: CI

on:
  push:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/actions@secret-server#latest
      - name: Configure git for private repos
        run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Verify Go is latest stable
        run: |
          INSTALLED=$(go env GOVERSION)
          LATEST=$(curl -sf 'https://go.dev/dl/?mode=json' | jq -r '.[0].version')
          echo "Installed: $INSTALLED  Latest: $LATEST"
          if [ "$INSTALLED" != "$LATEST" ]; then
            echo "::error::Go version $INSTALLED does not match latest stable $LATEST"
            exit 1
          fi

      - name: Build and test
        run: go run ./src
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

  # Test the composite action end-to-end using the binary we just built
  action-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/

  release:
    if: github.ref == 'refs/heads/v1'
    needs: [build, action-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Determine tag
        id: tag
        run: |
          TAG="v0.0.$(git log -1 --format=%ct)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign checksums
        run: cosign sign-blob build/checksums.txt --yes --output-signature build/checksums.txt.sig --output-certificate build/checksums.txt.pem

      - name: Release
        run: |
          chmod +x build/go-toolchain_linux_amd64
          ./build/go-toolchain_linux_amd64 release --tag "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
