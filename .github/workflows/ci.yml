name: CI

on:
  push:

permissions:
  contents: write
  id-token: write

env:
  GOPROXY: goproxy.pazer.io
  GOSUMDB: gosumdb.pazer.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Configure netrc for Go proxy
        run: |
          cat >> ~/.netrc <<EOF
          machine goproxy.pazer.io login ${{ secrets.GOPROXY_USER }} password ${{ secrets.GOPROXY_PASSWORD }}
          EOF
          chmod 600 ~/.netrc

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Verify Go is latest stable
        run: |
          INSTALLED=$(go env GOVERSION)
          LATEST=$(curl -sf 'https://go.dev/dl/?mode=json' | jq -r '.[0].version')
          echo "Installed: $INSTALLED  Latest: $LATEST"
          if [ "$INSTALLED" != "$LATEST" ]; then
            echo "::error::Go version $INSTALLED does not match latest stable $LATEST"
            exit 1
          fi

      - name: Build and test
        run: go run ./src
        env:
          GO_BUILDCACHE_CONFIG: ${{ secrets.GO_BUILDCACHE_CONFIG }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

  # Test the reusable workflow by having it build this repo using the binary we just built
  workflow-test:
    needs: build
    uses: ./.github/workflows/build.yml
    with:
      binary-artifact: go-toolchain-binary
    secrets: inherit

  release:
    if: github.ref == 'refs/heads/v1'
    needs: [build, workflow-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: go-toolchain-binary
          path: build

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Determine tag
        id: tag
        run: |
          TAG="v0.0.$(git log -1 --format=%ct)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sign checksums
        run: cosign sign-blob build/checksums.txt --yes --output-signature build/checksums.txt.sig --output-certificate build/checksums.txt.pem

      - name: Release
        run: |
          chmod +x build/go-toolchain_linux_amd64
          ./build/go-toolchain_linux_amd64 release --tag "${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
