name: CI

on:
  push:

permissions:
  contents: read

env:
  GOPROXY: direct
  GONOSUMDB: '*'
  GONOSUMCHECK: '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build and test
        run: go run ./src

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/go-toolchain_linux_amd64

  gha-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Build and test with action
        uses: ./

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binaries
          path: build/go-toolchain_*

  bootstrap-test:
    name: Bootstrap (no Go in PATH)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download go-toolchain binary
        uses: actions/download-artifact@v4
        with:
          name: go-toolchain-binary

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Remove Go and run bootstrap
        run: |
          set -euo pipefail

          # Install the pre-built binary
          chmod +x go-toolchain_linux_amd64
          sudo cp go-toolchain_linux_amd64 /usr/local/bin/go-toolchain

          # Remove all Go installations
          which -a go || true
          sudo rm -f $(which -a go) 2>/dev/null || true
          sudo rm -rf /usr/local/go /opt/hostedtoolcache/go
          unset GOROOT
          unset GOPATH

          # Verify go is gone
          if command -v go &>/dev/null; then
            echo "FAIL: go still in PATH at $(which go)"
            exit 1
          fi
          echo "OK: go is not in PATH"

          # go-toolchain should bootstrap Go from go.dev and succeed
          go-toolchain --help
