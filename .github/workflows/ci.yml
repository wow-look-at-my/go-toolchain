name: CI

on:
  push:

permissions:
  contents: read

env:
  GOPROXY: direct
  GONOSUMDB: '*'
  GONOSUMCHECK: '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build and test
        run: go run ./src

      - name: Validate version json fields
        run: |
          set -euo pipefail
          json=$(./build/go-toolchain version json)
          echo "$json"
          for field in version commit commit_date build_date; do
            val=$(echo "$json" | jq -r ".$field // empty")
            if [ -z "$val" ]; then
              echo "FAIL: field '$field' is missing or empty in version json"
              exit 1
            fi
            echo "OK: $field = $val"
          done

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

  gha-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_ORG_REPO_READ }}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Remove system Go
        run: |
          sudo rm -f $(which -a go) 2>/dev/null || true
          sudo rm -rf /usr/local/go /opt/hostedtoolcache/go
          hash -r
          if command -v go &>/dev/null; then
            echo "FAIL: go still in PATH at $(which go)"
            exit 1
          fi
          echo "OK: go is not in PATH"

      - name: Download go-toolchain binary
        uses: actions/download-artifact@v4
        with:
          name: go-toolchain-binary

      - name: Build and test with action
        uses: ./
        with:
          binary: go-toolchain

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-binaries
          path: build/go-toolchain_*
