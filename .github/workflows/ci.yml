name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  security-events: write
  actions: read
  checks: read

# The shared cache's look-ahead pool: the server sends the objects stored beside each hit ahead of the build asking, off the critical path (go-s3-server docs/look-ahead.md).
env:
  GO_TOOLCHAIN_CACHE_LOOKAHEAD: "16"

jobs:
  host-build:
    runs-on: ubuntu-latest
    steps:
      # No persisted credentials: the header checkout leaves in the workspace names THIS repository, so every git question about another one is asked as the wrong identity.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - uses: wow-look-at-my/actions@secret-server#latest

      # The last release a green master run published is the bootstrap, as it is for every consumer; a release without the linked go command hands the job to the from-scratch steps below. see docs/CI.md
      - name: Install the previous release as the bootstrap pipeline
        id: release
        run: |
          set -euo pipefail
          curl -fL --compressed "https://dl.pazer.build/go-toolchain?os=linux&arch=amd64" -o "$RUNNER_TEMP/gt-bootstrap"
          chmod +x "$RUNNER_TEMP/gt-bootstrap"
          if GO_TOOLCHAIN_LINKED_GO=1 sh "$RUNNER_TEMP/gt-bootstrap" go version; then
            echo "linked=true" >> "$GITHUB_OUTPUT"
          else
            echo "the previous release links no go command; bootstrapping from the fork checkout"
            echo "linked=false" >> "$GITHUB_OUTPUT"
          fi

      # The fork's last published release is the bootstrap compiler for its make.bash: its go command carries the cache client in process, so go_bootstrap compiles from the shared cache; a stock Go cannot reach it.
      - name: Install the fork's release as the bootstrap compiler
        if: steps.release.outputs.linked != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bootstrap"
          curl -fL --compressed "https://dl.pazer.build/gosmopolitan?branch=master&os=linux&arch=amd64" | tar -xz -C "$RUNNER_TEMP/bootstrap"
          echo "GOROOT_BOOTSTRAP=$RUNNER_TEMP/bootstrap/go" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bootstrap/go/bin/go" version

      # The pipeline links the fork's go command, so the fork's own build is what first compiles it; it runs after the secrets because a CI run of the fork's go command refuses to build with no shared cache configured. see docs/CI.md
      - name: Build the bootstrap go command from the fork checkout
        if: steps.release.outputs.linked != 'true'
        working-directory: _gosmopolitan/src
        run: ./make.bash

      # This job builds from source, so it needs the org read token action.yml gives every consumer.
      - name: Configure git for private repos
        if: env.PRIVATE_ORG_REPO_READ != ''
        run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      # The dats phase sandboxes every suite command (dats' default), and the backend it picks... see docs/CI.md
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      # The org module proxy is gone. Modules come from their own source, and the sumdb goes with the proxy that mirrored it. These are the values src/goenv.go already falls back to with no proxy configured.
      - name: Configure Go proxy
        run: |
          {
            echo "GOPROXY=direct"
            echo "GONOSUMDB=*"
            echo "GONOSUMCHECK=*"
          } >> "$GITHUB_ENV"

      # golang.org/x/text and the tools fork both name stringer in a //go:generate directive the fetch runs, and a missing generator is a hard failure. One pinned version on every host, so they all complete those modules to the same bytes for the shared cache.
      - name: Install the generators
        env:
          # Building a generator must not complete the module that provides it: that fetch wants the generator, which is what this step is making.
          GOGENERATEDEPS: "off"
        run: |
          set -euo pipefail
          if [ "${{ steps.release.outputs.linked }}" = "true" ]; then
            go="$RUNNER_TEMP/gt-bootstrap-go"
            printf '#!/bin/sh\nGO_TOOLCHAIN_LINKED_GO=1 exec sh "%s" go "$@"\n' "$RUNNER_TEMP/gt-bootstrap" > "$go"
            chmod +x "$go"
          else
            go="$PWD/_gosmopolitan/bin/go"
          fi
          # No GOOS, GOARCH or GOBIN: this go is an APE targeting cosmo, which is what it embeds, and cmd/go reads a cosmo build as a cross-compile because the host it RUNS on is not cosmo. A cross-compile refuses GOBIN and lands in a per-target subdirectory of GOPATH/bin.
          genbin="$("$go" env GOPATH)/bin/$("$go" env GOOS)_$("$go" env GOARCH)"
          for pkg in \
            golang.org/x/tools/cmd/stringer@v0.49.0 \
            golang.org/x/tools/cmd/goyacc@v0.49.0 \
            golang.org/x/text/cmd/gotext@v0.42.0 \
            github.com/mjibson/esc@v0.2.0 \
            google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.1 \
          ; do
            "$go" install "$pkg"
          done
          # protoc is a C++ binary, so go install cannot reach it. The release is pinned.
          protoc_version=27.2
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) protoc_asset=linux-x86_64 ;;
            Linux-ARM64) protoc_asset=linux-aarch_64 ;;
            macOS-X64) protoc_asset=osx-x86_64 ;;
            macOS-ARM64) protoc_asset=osx-aarch_64 ;;
            Windows-X64) protoc_asset=win64 ;;
            *) echo "no protoc release for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-${protoc_asset}.zip"
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          chmod +x "$RUNNER_TEMP/protoc/bin/protoc" || true
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          echo "$genbin" >> "$GITHUB_PATH"
          echo "GENBIN=$genbin" >> "$GITHUB_ENV"

      # The bootstrap pipeline is an APE the fork's own go command built from this tree, with the flags the pipeline builds itself with, so its compiler shares the passes' tool ID. see docs/CI.md
      - name: Build the bootstrap pipeline from the fork checkout
        if: steps.release.outputs.linked != 'true'
        run: |
          set -euo pipefail
          export GOROOT="$PWD/_gosmopolitan" GOTOOLCHAIN=local CGO_ENABLED=0
          "$GOROOT/bin/go" build -trimpath -o "$RUNNER_TEMP/gt-bootstrap" ./src

      # Lets the kernel start an APE, so the pipeline and the test binaries it builds exec bare. see docs/ACTION.md
      - name: Register the APE binfmt handler
        run: bash .github/scripts/register-ape-binfmt.sh

      - name: Build and test
        env:
          # Dependency-graph submission needs a token with contents: write (granted at the workflow... see docs/CI.md
          GITHUB_TOKEN: ${{ github.token }}
          # Every go process logs what the shared cache tier did, timestamped, to a file instead of stderr. see docs/CI.md
          GOCACHEDEBUG: "1"
          GOCACHELOG: ${{ runner.temp }}/gocache.log
        # A shell starts the APE, since execve alone reads no shell header; generate approvals live in go.mod. see docs/PIPELINE.md
        run: sh "$RUNNER_TEMP/gt-bootstrap"

      # The assertions live in the fixture, where an engineer can re-run them without pushing. see docs/CI.md
      - name: Check build profile
        uses: wow-look-at-my/dats@master
        with:
          tests: .github/dats-fixtures/cache-profile.dats

      - name: Cache validation (second build)
        # build/ in THIS job is the fat APE. A shell starts it, which is the only way an APE starts --... see docs/CI.md
        env:
          # The second build re-invokes go-toolchain, which also submits the dependency snapshot; give... see docs/CI.md
          GITHUB_TOKEN: ${{ github.token }}
          GOCACHEDEBUG: "1"
          GOCACHELOG: ${{ runner.temp }}/gocache.log
          # The test cache says per package why a result replayed or did not, which is what a slow second build needs answered. see docs/CI.md
          GODEBUG: gocachetest=1
        run: |
          cp build/go-toolchain /usr/local/bin/go-toolchain
          rm -rf build/
          start=$SECONDS
          go-toolchain
          elapsed=$(( SECONDS - start ))
          echo "Second build took ${elapsed}s"
          # A warm build of this module still links its APE with the standard library three times, once per self-build pass. see docs/CI.md
          if [ "$elapsed" -gt 600 ]; then
            echo "::error::Second build took ${elapsed}s (limit: 600s)"
            exit 1
          fi

      - name: Print the shared cache log
        if: always()
        run: cat "$RUNNER_TEMP/gocache.log"

      - name: Upload host binary
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: host-go-toolchain
          path: build/go-toolchain

      # Each generator is an APE, so one build of it runs on every host. The jobs that follow take these rather than compiling their own: this is the only host whose linked go can type-check against its embedded standard library, and it is the point of an APE that they need not.
      - name: Gather the generator APEs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/generators"
          cp "$GENBIN"/* "$RUNNER_TEMP/generators/"
          ls -la "$RUNNER_TEMP/generators"

      - name: Upload the generators
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: generator-apes
          path: ${{ runner.temp }}/generators

      # socketharness reproduces a coding agent's own tool-execution plumbing (a socketpair for a... see docs/CI.md
      - name: Build socketharness
        # A fixture of this workflow, not a shipped output, so the workflow itself reaches the linked go command the way a pipeline run does. see docs/CI.md
        env:
          GO_TOOLCHAIN_LINKED_GO: "1"
        run: |
          mkdir -p harness
          go-toolchain go build -o harness/socketharness .github/dats-fixtures/socketharness.go

      - name: Upload socketharness binaries
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: socketharness-build
          path: harness

  # The same build with no go-toolchain release involved: the fork's release runs the fork's make.bash, that go command builds the pipeline, and the pipeline builds itself; identical holds its APE to host-build's bytes. see docs/CI.md
  bootstrap-scratch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Install the fork's release as the bootstrap compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bootstrap"
          curl -fL --compressed "https://dl.pazer.build/gosmopolitan?branch=master&os=linux&arch=amd64" | tar -xz -C "$RUNNER_TEMP/bootstrap"
          echo "GOROOT_BOOTSTRAP=$RUNNER_TEMP/bootstrap/go" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bootstrap/go/bin/go" version

      - name: Build the bootstrap go command from the fork checkout
        working-directory: _gosmopolitan/src
        run: ./make.bash

      - name: Configure git for private repos
        if: env.PRIVATE_ORG_REPO_READ != ''
        run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The org module proxy is gone. Modules come from their own source, and the sumdb goes with the proxy that mirrored it. These are the values src/goenv.go already falls back to with no proxy configured.
      - name: Configure Go proxy
        run: |
          {
            echo "GOPROXY=direct"
            echo "GONOSUMDB=*"
            echo "GONOSUMCHECK=*"
          } >> "$GITHUB_ENV"

      # golang.org/x/text and the tools fork both name stringer in a //go:generate directive the fetch runs, and a missing generator is a hard failure. One pinned version on every host, so they all complete those modules to the same bytes for the shared cache.
      - name: Install the generators
        env:
          # Building a generator must not complete the module that provides it: that fetch wants the generator, which is what this step is making.
          GOGENERATEDEPS: "off"
        run: |
          set -euo pipefail
          go="$PWD/_gosmopolitan/bin/go"
          # No GOOS, GOARCH or GOBIN: the fork targets cosmo, so each generator comes out an APE every host runs, and cmd/go reads that as a cross-compile, which refuses GOBIN and lands in a per-target subdirectory of GOPATH/bin.
          genbin="$("$go" env GOPATH)/bin/$("$go" env GOOS)_$("$go" env GOARCH)"
          for pkg in \
            golang.org/x/tools/cmd/stringer@v0.49.0 \
            golang.org/x/tools/cmd/goyacc@v0.49.0 \
            golang.org/x/text/cmd/gotext@v0.42.0 \
            github.com/mjibson/esc@v0.2.0 \
            google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.1 \
          ; do
            "$go" install "$pkg"
          done
          # protoc is a C++ binary, so go install cannot reach it. The release is pinned.
          protoc_version=27.2
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) protoc_asset=linux-x86_64 ;;
            Linux-ARM64) protoc_asset=linux-aarch_64 ;;
            macOS-X64) protoc_asset=osx-x86_64 ;;
            macOS-ARM64) protoc_asset=osx-aarch_64 ;;
            Windows-X64) protoc_asset=win64 ;;
            *) echo "no protoc release for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-${protoc_asset}.zip"
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          chmod +x "$RUNNER_TEMP/protoc/bin/protoc" || true
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          echo "$genbin" >> "$GITHUB_PATH"

      - name: Build the bootstrap pipeline from the fork checkout
        run: |
          set -euo pipefail
          export GOROOT="$PWD/_gosmopolitan" GOTOOLCHAIN=local CGO_ENABLED=0
          "$GOROOT/bin/go" build -trimpath -o "$RUNNER_TEMP/gt-bootstrap" ./src

      - name: Register the APE binfmt handler
        run: bash .github/scripts/register-ape-binfmt.sh

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The same command the action runs, so identical compares like with like. see docs/CI.md
        run: sh "$RUNNER_TEMP/gt-bootstrap" matrix --cosmo-platforms linux/amd64,darwin/arm64,windows/amd64

      - name: Hand off the from-scratch APE
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: ape-scratch
          path: build/go-toolchain

  # Build + test via the composite action with NO target inputs, which is exactly what a... see docs/CI.md
  build:
    needs: host-build
    runs-on: ubuntu-latest
    steps:
      # Same reason as host-build: a persisted credential for this repository answers for no other one.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      # The dats phase sandboxes every suite command (dats' default), and the backend it picks... see docs/CI.md
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
            --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
            --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

      # Explicit name (host-build's "Upload host binary" hand-off): the strict cache-download... see docs/CI.md
      - name: Download host binary
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: build

      # host-build built these, and each one is an APE, so this host runs them rather than compiling its own.
      - name: Take the generators host-build built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: generator-apes
          path: ${{ runner.temp }}/generators

      - name: The generators answer here
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/generators/"* || true
          "$RUNNER_TEMP/generators/stringer" --help 2>&1 | head -1
          echo "$RUNNER_TEMP/generators" >> "$GITHUB_PATH"

      # The go-toolchain action itself cache-uploads build/ under the per-job name `go-build-<job... see docs/CI.md
      - uses: ./
        with:
          binary: build/go-toolchain
          autorelease: 'false'
          # A build of this module compiles the fork's standard library from its checkout, in passes. see docs/CI.md
          timeout: '30'

  # Each non-linux host builds this repo's APE with the linux-built binary, so a difference in the output is the host and nothing else. see docs/CI.md
  build-everywhere:
    needs: host-build
    strategy:
      matrix:
        include:
          - origin: darwin
            runner: macos-latest
            gt: gt-ape
          - origin: windows
            runner: windows-latest
            gt: gt-ape.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: wow-look-at-my/actions@secret-server#latest

      # The org module proxy is gone. Modules come from their own source, and the sumdb goes with the proxy that mirrored it. These are the values src/goenv.go already falls back to with no proxy configured.
      - name: Configure Go proxy
        shell: bash
        run: |
          {
            echo "GOPROXY=direct"
            echo "GONOSUMDB=*"
            echo "GONOSUMCHECK=*"
          } >> "$GITHUB_ENV"

      - name: Configure git for private repos
        if: env.PRIVATE_ORG_REPO_READ != ''
        shell: bash
        run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

      - name: Provision the sandbox backend (bubblewrap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The NT leg gets no backend step: a WSL1 dockerd answers `docker version` and then fails every run in runc, which is worse than no daemon. see docs/DATS-PHASE.md

      - name: Download host binary
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: dist

      # Not `uses: ./`: the action installs with sudo, which a windows runner has not. see docs/CI.md
      - name: Stage the APE
        shell: bash
        run: |
          set -euo pipefail
          cp dist/go-toolchain "$RUNNER_TEMP/${{ matrix.gt }}"
          chmod +x "$RUNNER_TEMP/${{ matrix.gt }}"

      # host-build built these, and each one is an APE, so darwin and NT run them rather than compiling their own. Only a linux host's linked go can type-check against its embedded standard library, and an APE is exactly what spares the others from needing to.
      - name: Take the generators host-build built
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: generator-apes
          path: ${{ runner.temp }}/generators

      - name: The generators answer here
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/generators"
          chmod +x ./* || true
          # NT looks a command up by its .exe name, and an APE carries the PE header that name promises.
          if [ "$RUNNER_OS" = "Windows" ]; then
            for f in *; do
              case "$f" in *.exe | *.elf) continue ;; esac
              cp -- "$f" "$f.exe"
            done
          fi
          ./stringer --help 2>&1 | head -1
          echo "$RUNNER_TEMP/generators" >> "$GITHUB_PATH"

      # A dependency's generate directives run $GOROOT/bin/go, and this GOROOT is the fork checkout, where only a host that ran make.bash has one. The APE is that go command, so it goes there under that name.
      - name: Put the go command where GOROOT looks for it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _gosmopolitan/bin
          cp "$RUNNER_TEMP/${{ matrix.gt }}" _gosmopolitan/bin/go
          chmod +x _gosmopolitan/bin/go
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp _gosmopolitan/bin/go _gosmopolitan/bin/go.exe
          fi

      - name: Build this repo's APE here
        shell: bash
        env:
          # A build inside the checkout submits a dependency snapshot, and a missing token fails it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/${{ matrix.gt }}" matrix --no-benchmark

      - name: Hand off this host's APE
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: ape-${{ matrix.origin }}
          path: build/go-toolchain

  # The smoke jobs run ONE host's APE on all three. That says what every host ships only if every... see docs/CI.md
  identical:
    needs: [build, build-everywhere, bootstrap-scratch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only for the dats fixture below -- this job otherwise runs no repo code.
      - uses: actions/checkout@v7

      # ape/linux is `build`'s hand-off, the same bytes `publish` ships.
      - name: Download each host's APE
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: ape/linux
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-darwin
          path: ape/darwin
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-windows
          path: ape/windows
      # The APE a from-scratch bootstrap reached, with no release in its ancestry.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ape-scratch
          path: ape/scratch
      # The APE host-build reached, which `build` ran to produce ape/linux.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: host-go-toolchain
          path: ape/host

      - name: What each host handed off
        run: sha256sum ape/*/go-toolchain

      - name: Where the build job's APE differs from the host-build APE it ran
        run: bash .github/scripts/explain-mismatch.sh ape/host/go-toolchain ape/linux/go-toolchain

      - name: Where the from-scratch bootstrap differs
        run: bash .github/scripts/explain-mismatch.sh ape/linux/go-toolchain ape/scratch/go-toolchain

      # The cross-host pairs are the ones the fixture below actually compares, so a red run says which bytes moved rather than only that some did.
      - name: Where each host's APE differs from the linux one
        run: |
          for host in darwin windows; do
            echo "=== linux vs $host"
            bash .github/scripts/explain-mismatch.sh ape/linux/go-toolchain "ape/$host/go-toolchain"
          done

      # A missing hand-off fails too: comparing the hosts that answered proves nothing. see docs/CI.md
      - name: Every host built the same bytes
        uses: wow-look-at-my/dats@master
        with:
          tests: .github/dats-fixtures/identical.dats

      # The differing bytes, for a local diff after a red run.
      - name: Keep the APEs that differed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apes-that-differed
          path: |
            ape/host/go-toolchain
            ape/linux/go-toolchain
            ape/scratch/go-toolchain
          compression-level: 1

  # One suite, every host: a host-specific answer is paired with uname inside the fixture. see docs/CI.md
  smoke:
    needs: [host-build, build]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cold stdlib compile under the fork is slower on NT than on the other two hosts.
    timeout-minutes: 30
    steps:
      # Only for the dats fixtures in .github/dats-fixtures/ -- this job otherwise runs no repo code.
      - uses: actions/checkout@v7

      # For GO_BUILDCACHE_CONFIG alone: the fork refuses a CI build without it. see docs/CI.md
      - uses: wow-look-at-my/actions@secret-server#latest

      # Explicit name on purpose: by this point the run holds SEVERAL hand-offs (host-go-toolchain... see docs/CI.md
      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: dist

      # socketharness reproduces a coding agent's own tool-execution plumbing (a socketpair for a... see docs/CI.md
      - name: Download socketharness hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: socketharness-build
          path: harness

      # The smoke's nested pipeline is a CI run, and the fork refuses one with no build cache to write to. see docs/CI.md
      - uses: wow-look-at-my/actions@secret-server#latest

      # Sandboxed like every other suite; the APE carries its compiler and standard library, so nothing is downloaded. see docs/CI.md
      - name: Smoke suite
        uses: wow-look-at-my/dats@master
        env:
          # The org proxy wants auth to look up a module it has never seen, and this job's throwaway module always is one. see docs/CI.md
          GO_PROXY_CONFIG: ""
        with:
          tests: .github/dats-fixtures/smoke.dats

  publish:
    needs: [identical, smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
      deployments: write
      artifact-metadata: write
    steps:
      # Explicit name: multiple same-run hand-offs -- see smoke-linux.
      - uses: actions/checkout@v7

      - name: Download build outputs hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build.broot
          path: build/

      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          path: build

      - uses: wow-look-at-my/actions@cache-cleanup#latest
        if: always()
