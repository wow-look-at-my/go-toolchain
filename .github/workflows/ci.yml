name: CI

on:
  push:

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: wow-look-at-my/actions@secret-server#latest

      - name: Configure Go proxy
        run: |
          if [ -n "$GO_PROXY_CONFIG" ]; then
            proxy=$(echo "$GO_PROXY_CONFIG" | base64 -d | jq -r '.proxy // empty')
            if [ -n "$proxy" ]; then
              echo "GOPROXY=${proxy}|direct" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build and test
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.pazer.tube
          OTEL_SERVICE_NAME: ${{ github.repository }}
          # Dependency-graph submission needs a token with contents: write
          # (granted at the workflow level above). A bare `go run ./src` does
          # not inherit one, so pass it explicitly. Without it, submission can't
          # authenticate and fails loudly -- this is what wires the feature up.
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./src

      - name: Cache validation (second build)
        env:
          # The second build re-invokes go-toolchain, which also submits the
          # dependency snapshot; give it the same token so it succeeds rather
          # than warning. Same job + correlator as the first submission, so it
          # replaces it (idempotent) rather than duplicating.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp build/go-toolchain /usr/local/bin/go-toolchain
          rm -rf build/
          start=$SECONDS
          go-toolchain
          elapsed=$(( SECONDS - start ))
          echo "Second build took ${elapsed}s"
          if [ "$elapsed" -gt 30 ]; then
            echo "::error::Second build took ${elapsed}s (limit: 30s)"
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: go-toolchain-binary
          path: build/go-toolchain
          if-no-files-found: error

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-profiles
          path: /tmp/go-toolchain-profile/
          if-no-files-found: ignore

  # Test the composite action end-to-end using the binary we just built
  action-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false
      # Exercise the composite action end-to-end, but do NOT publish from here.
      # The action defaults autorelease: true (for consumer repos); leaving it on
      # would publish a second, duplicate release every CI run, on top of the
      # dedicated publish-buildhost job below. That job is the single publisher.
      - uses: ./
        with:
          autorelease: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build/

  publish-buildhost:
    if: github.ref_type == 'branch'
    needs: [build, action-test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
