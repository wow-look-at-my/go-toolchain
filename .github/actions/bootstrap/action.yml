name: Bootstrap the pipeline
description: Everything host-build and bootstrap-scratch run before the pipeline builds itself, ending with the bootstrap pipeline at RUNNER_TEMP/gt-bootstrap.

inputs:
  from-release:
    description: "'true' bootstraps from the last go-toolchain release when it links a go command; 'false' always builds from the fork checkout."
    required: true

outputs:
  linked:
    description: "'true' when the previous release is the bootstrap pipeline."
    value: ${{ steps.release.outputs.linked }}

runs:
  using: composite
  steps:
    - uses: wow-look-at-my/actions@secret-server#latest

    # The last release a green master run published is the bootstrap, as it is for every consumer. A release without the linked go command hands the job to the from-scratch steps below. see docs/CI.md
    - name: Take the previous release
      id: bootstrap
      if: inputs.from-release == 'true'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: go-toolchain
        path: ${{ runner.temp }}/gt-bootstrap
        required: false

    - name: Install the previous release as the bootstrap pipeline
      id: release
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.bootstrap.outputs.downloaded }}" != true ]; then
          echo "no previous release to bootstrap from; bootstrapping from the fork checkout"
          echo "linked=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The release is the go command under the name go. An older one runs its own version command there instead, which prints no "go version" line.
        goroot_bin="$RUNNER_TEMP/gt-bootstrap-goroot/bin"
        mkdir -p "$goroot_bin"
        cp "$RUNNER_TEMP/gt-bootstrap" "$goroot_bin/go"
        chmod +x "$goroot_bin/go"
        said="$(sh "$goroot_bin/go" version 2>&1 || true)"
        printf '%s\n' "$said"
        if [[ "$said" == "go version "* ]]; then
          echo "linked=true" >> "$GITHUB_OUTPUT"
        else
          echo "the previous release links no go command; bootstrapping from the fork checkout"
          echo "linked=false" >> "$GITHUB_OUTPUT"
        fi

    # The fork's last published release is the bootstrap compiler for its make.bash. Its go command carries the cache client in process, so go_bootstrap compiles from the shared cache. A stock Go cannot reach it.
    - name: Take the fork's release
      if: steps.release.outputs.linked != 'true'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        # No fmt: a GOROOT is stored as a tar.gz, and repackaging wraps it again.
        project: gosmopolitan
        branch: master
        path: ${{ runner.temp }}/gosmopolitan.tar.gz
        executable: false

    - name: Install the fork's release as the bootstrap compiler
      if: steps.release.outputs.linked != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ runner.temp }}/bootstrap"
        tar -xzf "${{ runner.temp }}/gosmopolitan.tar.gz" -C "${{ runner.temp }}/bootstrap"
        echo "GOROOT_BOOTSTRAP=${{ runner.temp }}/bootstrap/go" >> "$GITHUB_ENV"
        "${{ runner.temp }}/bootstrap/go/bin/go" version

    # The fork's cmd/dist and this pipeline's fork sync compile the APE loaders with these, from the fork's own pinned install.
    - name: Install the APE loader tools
      uses: ./_gosmopolitan/.github/actions/apeld-tools

    # The pipeline links the fork's go command, so the fork's own build is what earliest compiles it; it runs after the secrets because a CI run of the fork's go command refuses to build with no shared cache configured. see docs/CI.md
    - name: Build the bootstrap go command from the fork checkout
      if: steps.release.outputs.linked != 'true'
      shell: bash
      working-directory: _gosmopolitan/src
      run: ./make.bash

    # This job builds from source, so it needs the org read token action.yml gives every consumer.
    - name: Configure git for private repos
      if: env.PRIVATE_ORG_REPO_READ != ''
      shell: bash
      run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"

    # The dats phase sandboxes every suite command (dats' default), and the backend it picks... see docs/CI.md
    - name: Provision the sandbox backend (bubblewrap)
      uses: wow-look-at-my/actions@cached-apt#latest
      with:
        packages: bubblewrap

    # The probe is the point: a restored bwrap that cannot open a namespace here fails now rather than in the dats phase.
    - name: Prove bwrap builds a sandbox here
      shell: bash
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        bwrap --ro-bind-try /usr /usr --ro-bind-try /bin /bin --ro-bind-try /lib /lib \
          --ro-bind-try /lib64 /lib64 --ro-bind-try /etc /etc \
          --dev /dev --proc /proc --tmpfs /tmp --chdir / --unshare-pid --die-with-parent true

    # The org module proxy is gone. Modules come from their own source, and the sumdb goes with the proxy that mirrored it. These are the values src/goenv.go already falls back to with no proxy configured.
    - name: Configure Go proxy
      shell: bash
      run: |
        {
          echo "GOPROXY=direct"
          echo "GOSUMDB=off"
          echo "GONOSUMDB=*"
          echo "GONOSUMCHECK=*"
          echo "GOTOOLCHAIN=local"
          echo "GOTELEMETRY=off"
        } >> "$GITHUB_ENV"

    # The go command the generators build with, named for the cached run and the PATH step, neither of which can see a variable the other set.
    - name: Choose the go command the generators build with
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.release.outputs.linked }}" = "true" ]; then
          # The release step put the APE under the name go, which is the go command. A shell starts it: the binfmt handler is not registered yet.
          goroot_bin="$RUNNER_TEMP/gt-bootstrap-goroot/bin"
          go="$RUNNER_TEMP/gt-bootstrap-go"
          printf '#!/bin/sh\nexec sh "%s" "$@"\n' "$goroot_bin/go" > "$go"
          chmod +x "$go"
        else
          go="$PWD/_gosmopolitan/bin/go"
          goroot_bin="$PWD/_gosmopolitan/bin"
        fi
        echo "GEN_GO=$go" >> "$GITHUB_ENV"
        echo "GEN_GOROOT_BIN=$goroot_bin" >> "$GITHUB_ENV"

    # golang.org/x/text and the tools fork both name stringer in a //go:generate directive the fetch runs, and a missing generator is a hard failure. The go command builds these, so its identity is in the key: a rebuilt fork must not restore generators its predecessor produced.
    - name: Install the generators
      uses: wow-look-at-my/actions@cached-run#latest
      with:
        key: generators-${{ steps.release.outputs.linked }}
        paths: ~/go/bin
        run: |
          go="$GEN_GO"
          export PATH="$GEN_GOROOT_BIN:$PATH"
          # No GOOS, GOARCH or GOBIN: this go is an APE targeting cosmo, which is what it embeds, and cmd/go reads a cosmo build as a cross-compile because the host it RUNS on is not cosmo. A cross-compile refuses GOBIN and lands in a per-target subdirectory of GOPATH/bin.
          genbin="$("$go" env GOPATH)/bin/$("$go" env GOOS)_$("$go" env GOARCH)"
          mkdir -p "$genbin"
          export PATH="$genbin:$PATH"
          # Each generator is built from a GitHub checkout whose golang.org requirements point at GitHub, so no go command here resolves a path through golang.org. The org's own x/tools is what gopls and the analyzers here already build against. Completing x/text runs a directive that starts gotext, so gotext cannot come from a module fetch either.
          bash .github/scripts/build-from-github.sh "$go" https://github.com/wow-look-at-my/gosmopolitan_tools "" "$genbin" cmd/stringer cmd/goyacc
          bash .github/scripts/build-from-github.sh "$go" https://github.com/golang/text v0.42.0 "$genbin" cmd/gotext
          bash .github/scripts/build-from-github.sh "$go" https://github.com/protocolbuffers/protobuf-go v1.34.1 "$genbin" cmd/protoc-gen-go
          "$go" install github.com/mjibson/esc@v0.2.0
          # cached-run carries these with the paths, so a hit that skips this script still exports them.
          echo "$genbin" >> "$GITHUB_PATH"
          echo "$GEN_GOROOT_BIN" >> "$GITHUB_PATH"
          echo "GENBIN=$genbin" >> "$GITHUB_ENV"

    # protoc is a C++ binary, so go install cannot reach it. The release is pinned, which is the whole key: nothing this repo builds changes it.
    - name: Install protoc
      uses: wow-look-at-my/actions@cached-run#latest
      with:
        key: protoc-27.2
        paths: ~/protoc
        run: |
          protoc_version=27.2
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) protoc_asset=linux-x86_64 ;;
            Linux-ARM64) protoc_asset=linux-aarch_64 ;;
            macOS-X64) protoc_asset=osx-x86_64 ;;
            macOS-ARM64) protoc_asset=osx-aarch_64 ;;
            Windows-X64) protoc_asset=win64 ;;
            *) echo "no protoc release for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-${protoc_asset}.zip"
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$HOME/protoc"
          chmod +x "$HOME/protoc/bin/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"

    # The bootstrap pipeline is an APE the fork's own go command built from this tree, with the flags the pipeline builds itself with, so its compiler shares the passes' tool ID. see docs/CI.md
    - name: Build the bootstrap pipeline from the fork checkout
      if: steps.release.outputs.linked != 'true'
      shell: bash
      run: |
        set -euo pipefail
        export GOROOT="$PWD/_gosmopolitan" GOTOOLCHAIN=local CGO_ENABLED=0
        "$GOROOT/bin/go" build -trimpath -o "${{ runner.temp }}/gt-bootstrap" ./src

    # Lets the kernel start an APE, so the pipeline and the test binaries it builds exec bare. see docs/ACTION.md
    - name: Register the APE binfmt handler
      shell: bash
      run: bash .github/scripts/register-ape-binfmt.sh

    # embedstd compiles runtime/cgo for both architectures into the standard library the binary carries. see docs/CI.md
    - name: Install cosmocc
      shell: bash
      run: bash .github/scripts/install-cosmocc.sh
