name: 'handoff-probe'
description: >-
  TEMPORARY e2e probe (removed before merge): saves a tiny hand-off through
  the real cache-upload action using the exact per-job/per-leg name
  expression from the repo root action.yml, then asserts the resulting cache
  key round-tripped verbatim. Matrix-leg distinctness and plain-job
  byte-identity are asserted by the probe jobs in ci.yml.

outputs:
  key:
    description: 'The cache key the probe hand-off was saved under'
    value: ${{ steps.up.outputs.key }}

runs:
  using: 'composite'
  steps:
    - name: Write probe payload
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/handoff-probe-payload"
        echo "payload-from-${GITHUB_JOB}-idx-${{ strategy.job-index }}-val-${{ matrix.probe }}" \
          > "${RUNNER_TEMP}/handoff-probe-payload/marker.txt"

    # The `name` below MUST stay byte-identical to the per-job hand-off name
    # in the repo root action.yml -- it is the expression under test.
    - name: Save probe hand-off
      id: up
      uses: wow-look-at-my/actions@cache-upload#latest
      with:
        name: go-build-${{ github.job }}${{ matrix && format('.m{0}', strategy.job-index) || '' }}
        path: ${{ runner.temp }}/handoff-probe-payload

    - name: Assert saved key round-tripped
      shell: bash
      env:
        SAVED_KEY: ${{ steps.up.outputs.key }}
        WANT_NAME: go-build-${{ github.job }}${{ matrix && format('.m{0}', strategy.job-index) || '' }}
      run: |
        set -euo pipefail
        want_key="cache-xfer-${GITHUB_RUN_ID}-${WANT_NAME}-${GITHUB_RUN_ATTEMPT}"
        echo "PROBE saved_key=[${SAVED_KEY}] want_key=[${want_key}]"
        if [ "${SAVED_KEY}" != "${want_key}" ]; then
          echo "::error::hand-off key mismatch: saved '${SAVED_KEY}', want '${want_key}'"
          exit 1
        fi
