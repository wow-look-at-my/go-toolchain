name: Assert a single multi-platform APE
description: >-
  Fails unless the given directory holds exactly one fat APE plus its manifest,
  with no per-platform binaries. This repo ships one APE covering every
  supported platform; per-platform binaries ended. Used on both the build
  output and the publish payload, because only the second is what consumers
  actually receive.

inputs:
  path:
    description: 'Directory to check'
    required: true
  binary:
    description: 'Expected binary name (the manifest download filename)'
    required: true
  platforms:
    description: 'Comma-separated os/arch pairs the APE must cover, in order'
    required: true

runs:
  using: composite
  steps:
    - uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          const dir: string = "${{ inputs.path }}";
          const binary: string = "${{ inputs.binary }}";
          const want: string[] = "${{ inputs.platforms }}".split(",").map((p: string) => p.trim());
          const fail = (msg: string) => core.setFailed(`${dir}: ${msg}`);

          if (!fs.existsSync(dir)) { fail("does not exist"); return; }
          const entries: string[] = fs.readdirSync(dir);
          core.info(`${dir} holds: ${entries.join(", ")}`);

          const manifestPath = `${dir}/buildhost-artifacts.json`;
          if (!fs.existsSync(manifestPath)) { fail("no buildhost-artifacts.json -- the APE would publish under no platform set"); return; }
          const m = JSON.parse(fs.readFileSync(manifestPath, "utf-8"));
          if (m.schema !== 1) fail(`manifest schema ${m.schema}, want 1`);
          if (m.artifacts?.length !== 1) { fail(`manifest lists ${m.artifacts?.length} artifacts, want 1`); return; }

          const a = m.artifacts[0];
          if (a.file !== `${binary}_cosmo_fat`) fail(`manifest names ${a.file}, want ${binary}_cosmo_fat`);
          if (a.filename !== binary) fail(`manifest download filename is ${a.filename}, want ${binary}`);
          if (JSON.stringify(a.platforms) !== JSON.stringify(want)) {
            fail(`manifest platforms ${JSON.stringify(a.platforms)}, want ${JSON.stringify(want)}`);
          }
          if (!fs.existsSync(`${dir}/${a.file}`)) fail(`manifest names ${a.file}, which is not there`);

          // A file matching the per-platform grammar is a binary this org no longer ships.
          const perPlatform = entries.filter((f: string) => /_(?:linux|darwin|windows|js|wasip1|wasm)_[a-z0-9]+(\.exe)?$/.test(f));
          if (perPlatform.length > 0) fail(`per-platform binaries present: ${perPlatform.join(", ")}`);

          core.info(`one APE (${a.file}) covering ${a.platforms.join(", ")}, no per-platform binaries`);
